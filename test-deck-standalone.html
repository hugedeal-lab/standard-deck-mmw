<script>/* ---- standard-deck.js ---- */
/* ============================================================
 standard-deck.js -- Core Rendering Engine (standard-deck-mmw)
 Forked from standard-deck-v3's standard-deck.js v6.0.6. Fresh start,
 MMW-exclusive: PALETTE and ACCENT_FAMILIES rebuilt to MMW's 4 brand
 families only (spark/canopy/aurora/tide) - legacy MNAO 13-family
 system dropped per project decision. Everything else (rendering,
 resolveColor, font handling) inherited unchanged from v6.0.6.
 ============================================================ */

(function () {
'use strict';

var CANVAS_W = 1920;
var CANVAS_H = 1200;
var SLIDE_W  = 13.33;
var SLIDE_H  = 7.5;
var SX       = CANVAS_W / SLIDE_W;
var SY       = CANVAS_H / SLIDE_H;
var PT_PX    = SY / 72;

// ============================================================
// LAYOUT CONSTANTS
// ============================================================

  SLIDE_W: 13.33, SLIDE_H: 7.50,
  SAFE_X_MIN: 0.50, SAFE_X_MAX: 12.92, SAFE_W: 12.42,
  SAFE_Y_MIN: 0.75, SAFE_Y_MAX: 7.00,
  BAR_H: 0.08, TAG_Y: 0.75, TAG_H: 0.25,
  TITLE_Y: 1.10, TITLE_H_1: 0.55, TITLE_H_2: 0.90,
  HEADER_END: 1.75,
  CONTENT_Y: 2.10, CONTENT_Y_2: 2.30, CONTENT_END: 6.80,
  FOOTER_Y: 7.00, GAP: 0.25, TEXT_RATIO: 0.80,
  GRID: {
    full: { cols: [{ x: 0.50, w: 12.42 }] },
    col1: { cols: [{ x: 0.50, w: 12.42 }] },
    col2: { cols: [{ x: 0.50, w: 6.09 }, { x: 6.84, w: 6.08 }] },
    col3: { cols: [{ x: 0.50, w: 3.97 }, { x: 4.72, w: 3.97 }, { x: 8.94, w: 3.97 }] },
    col4: { cols: [{ x: 0.50, w: 2.92 }, { x: 3.67, w: 2.92 }, { x: 6.84, w: 2.92 }, { x: 10.01, w: 2.92 }] },
    col5: { cols: [{ x: 0.50, w: 2.28 }, { x: 3.03, w: 2.28 }, { x: 5.56, w: 2.28 }, { x: 8.09, w: 2.28 }, { x: 10.62, w: 2.28 }] }
  },
  TITLE_WRAP_THRESHOLD: 36
};

var SAFE = { x: SD_CONST.SAFE_X_MIN, y: SD_CONST.SAFE_Y_MIN, x2: SD_CONST.SAFE_X_MAX, y2: SD_CONST.SAFE_Y_MAX };

// ============================================================
// MNAO PALETTE
// ============================================================

var PALETTE = {
  black: '#262626', deepBlack: '#262626',   // MMW Asphalt
  white: '#EEEEEE',                          // MMW Paper
  dkGray: '#535B69', mdGray: '#333333',
  gray: '#999999', ltGray: '#CCCCCC',
  ok: '#28A745', warn: '#E67E00', bad: '#C12638',

  // ---- MMW template-confirmed tokens (v2.0) -------------------
  // NOTE: resolveColor() checks its `semantics` map BEFORE PALETTE, and
  // semantics.white/.black are #FFFFFF/#000000. Use `paper`/`asphalt`
  // for MMW Paper and MMW Asphalt -- `white`/`black` are pure values.
  asphalt:      '#262626',  // MMW Asphalt (slide master bg, dark surfaces)
  paper:        '#EEEEEE',  // MMW Paper (light surfaces, title on dark)
  paperHi:      '#EFEFEF',  // cover title on dark
  accentDim:    '#BFA588',  // report-chassis eyebrow, Thank You Dark title
  titleGray:    '#919292',  // report-chassis title
  bodyGray:     '#808080',  // body copy on light surfaces
  captionGray:  '#5E5E5E',  // captions, form labels
  mutedGray:    '#868686',  // draft-date footer, social secondary copy
  lt2:          '#D5D5D5',  // headline-light bg, social rail fill
  dividerLight: '#F5F5F5',  // Divider Light background only
  nearBlack:    '#1A1A1A',  // dark card fills in report components
  cardSand:     '#EAE7E0',  // Storyboard 02 caption cards
  ink:          '#221F20'   // Casting_Talent labels
};

// ============================================================
// MMW ACCENT FAMILIES (4)
// ============================================================

var ACCENT_FAMILIES = {
  // MMW palette, sourced from brand.json / MMW brand kit. 4-step tint
  // ramps collapsed to light/mid/dark: dark=ramp[0], mid=ramp[1],
  // light=ramp[3]. Fresh MMW-exclusive repo - legacy MNAO families
  // (bronze/red/navy/green/plum/gold/teal/charcoal/copper/indigo/
  // slate/wine/sage) intentionally dropped; pull from standard-deck-v3
  // if a non-MMW family is ever genuinely needed here.
  // spark.mid is the TEMPLATE-CONFIRMED value (#C4A584, 19 occurrences in
  // MMW PPT Template_7.24.26.pptx). brand.json documents #C4A484, which
  // appears nowhere in the template. Pending a brand-owner ruling; revert
  // this one value if brand.json is declared canonical.
  spark:    { light: '#FFE0C0', mid: '#C4A584', dark: '#9C7C5C' },  // MMW main accent
  canopy:   { light: '#B3BCB5', mid: '#43644B', dark: '#203822' },  // MMW secondary, green
  aurora:   { light: '#AFAEC1', mid: '#585181', dark: '#2D273D' },  // MMW secondary, purple
  tide:     { light: '#7CACC1', mid: '#074169', dark: '#0B2A47' }   // MMW secondary, blue
};

// Read off the template's own 10 chart parts, ordered brand-forward. v1.0's
// values were transcribed by eye and every one was a near-miss: #C4A484 for
// #C4A485, #7CACC1 for #7CA8C1, #43644B for #4A634D, #B3BCB5 for #B3BDB6.
// Series ramps taken from the template's own charts: the 2-series bars
// (chart2/chart6, the "native chart in a fixed well" pair) are tan + gray, the
// 6-series bars (chart3/chart7) run tan, gray, green, blue, sage, dark. v1 led
// with blue at position 2, so every 2-series chart came out tan + blue.
// _DARK is the dark-chassis ramp (pos 6 lightened so a 6th series clears the
// #262626 ground); _LIGHT swaps in the deeper blue the light charts use.
var CHART_SERIES = ['#BFA588', '#808080', '#4A634D', '#7CA8C1', '#B3BDB6', '#E8E8E8'];
var CHART_SERIES_LIGHT = ['#BFA588', '#808080', '#4A634D', '#416986', '#B3BDB6', '#262626'];

var _accentLight = '#FFE0C0';
var _accentMid   = '#C4A484';
var _accentDark  = '#9C7C5C';
var _familyName  = 'spark';

// Arial). v1.0 mapped BOTH to Mazda Type, so body copy previewed in the display
// face -- the template's body font is Arial, not Mazda Type.
var FONT_MAP = {
  H:  { face: '"Mazda Type Bold", "Mazda Type", Helvetica, Arial, sans-serif', weight: 500 },
  HR: { face: '"Mazda Type", Helvetica, Arial, sans-serif', weight: 400 },
  B:  { face: 'Arial, Helvetica, sans-serif', weight: 400 }
};

var LIMITS = {
  bullets: 5, tableRows: 8, tableCols: 5,
  cards: 4, stats: 6, paragraphs: 3, rows: 4,
  cardTitleChars: 30, statLabelChars: 25,
  coverTitleChars: 40, titleChars: 48
};

var MIN_SIZES = {
  coverTitle: 36, title: 33, cardTitle: 21,
  subtitle: 18, body: 15, table: 12,
  statValue: 42, tag: 10, footnote: 6   // 6, not 7: MMW grid captions are 6.5pt
};

// ============================================================
// TYPOGRAPHY
// ============================================================

var TEXT_STYLES = {
  L1: { transform: 'uppercase', spacing: '0.25em', weight: 500 },
  L2: { transform: 'uppercase', spacing: '0.05em', weight: 500 },
  L3: { transform: 'uppercase', spacing: '0.08em', weight: 500 },
  L4: { transform: 'none',      spacing: 'normal', weight: 400 },
  L5: { transform: 'uppercase', spacing: '0.10em', weight: 400 }
};

var _currentSlideLayout = null;

function getTextStyle(el) {
  if (el.textStyle && TEXT_STYLES[el.textStyle]) return el.textStyle;
  if ((_currentSlideLayout === 'cover' || _currentSlideLayout === 'closing') && el.size >= 36) return 'L1';
  if ((_currentSlideLayout === 'divider' || _currentSlideLayout === 'coverloc') && el.size >= 36) return 'L4';
  if (el.size >= 30 && el.font === 'H' && !el.textStyle) return 'L2';
  if (el.color === 'accent' && el.size <= 14 && el.font === 'H') return 'L3';
  if (el.size >= 18 && el.size <= 24 && el.font === 'H') return 'L3';
  if (el.size <= 10 || el.color === 'muted') return 'L5';
  return 'L4';
}

// ============================================================
// DATE GENERATION
// ============================================================

var MONTHS = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];

function getFooterDate() {
  var now = new Date();
  return MONTHS[now.getMonth()] + ' ' + now.getFullYear();
}

// ============================================================
// COLOR RESOLUTION
// ============================================================

function resolveColor(token, isDark) {
  if (!token || typeof token !== 'string') return isDark ? PALETTE.white : PALETTE.black;
  if (token.charAt(0) === '#') return token;
  var semantics = {
    title: isDark ? PALETTE.white : PALETTE.black,
    body: isDark ? PALETTE.ltGray : PALETTE.mdGray,
    sub: isDark ? _accentLight : PALETTE.mdGray,
    muted: PALETTE.gray,
    accent: _accentMid, accentLt: _accentLight, accentDk: _accentDark,
    cardBg: isDark ? PALETTE.dkGray : '#FFFFFF',
    cardBorder: isDark ? 'transparent' : PALETTE.ltGray,
    slideBg: isDark ? PALETTE.black : PALETTE.white,
    white: '#FFFFFF', black: '#000000',
    deepBlack: PALETTE.deepBlack
  };
  if (semantics[token]) return semantics[token];
  if (PALETTE[token]) return PALETTE[token];
  return isDark ? PALETTE.white : PALETTE.black;
}

function colorForPptx(token, isDark) {
  return resolveColor(token, isDark).replace('#', '');
}

// ============================================================
// BACKGROUND MODE — removed, no-ops for compat
// ============================================================

function setBgMode() {}
function getBgMode() { return 'standard'; }
function detectBgMode() { return 'standard'; }

// ============================================================
// COORDINATE CONVERSION
// ============================================================

function toX(inches) { return Math.round(inches * SX); }
function toY(inches) { return Math.round(inches * SY); }
function ptToPx(pt)  { return Math.round(pt * PT_PX); }

// ============================================================
// TITLE HEIGHT DETECTION
// ============================================================

function getTitleMetrics(title) {
  var len = (title || '').length;
  if (len > SD_CONST.TITLE_WRAP_THRESHOLD) {
    return { titleH: SD_CONST.TITLE_H_2, contentY: SD_CONST.CONTENT_Y_2 };
  }
  return { titleH: SD_CONST.TITLE_H_1, contentY: SD_CONST.CONTENT_Y };
}

// ============================================================
// SAFE AREA VALIDATION
// ============================================================

function validatePosition(el, slideIndex) {
  if (!el || typeof el.x === 'undefined' || typeof el.y === 'undefined') return;
  var C = SD_CONST;
  var right = el.x + (el.w || 0);
  var bottom = el.y + (el.h || 0);
  if (el.type === 't' && el.y < C.CONTENT_Y) {
    if (el.y >= C.TAG_Y && el.y <= C.TITLE_Y + C.TITLE_H_2) return;
  }
  if (el.y < C.CONTENT_Y && el.type !== 't') {
    console.warn('[SD] Slide ' + slideIndex + ': Element at y:' + el.y + ' above CONTENT_Y');
  }
  if (bottom > C.CONTENT_END) {
    console.warn('[SD] Slide ' + slideIndex + ': Element bottom y:' + bottom.toFixed(2) + ' exceeds CONTENT_END');
  }
  if (right > C.SAFE_X_MAX) {
    console.warn('[SD] Slide ' + slideIndex + ': Element right x:' + right.toFixed(2) + ' exceeds SAFE_X_MAX');
  }
}

// ============================================================
// SLIDE & ELEMENT VALIDATION
// ============================================================

function validateSlide(slide, index) {
  var warn = function (msg) { console.warn('[standard-deck] Slide ' + index + ': ' + msg); };
  // A layout can opt in to raw elements by listing 'els' in its LAYOUT_KEYS
  // (the canvas* blanks and the reportGray/reportDark chassis do -- their whole
  // point is hand-placed content). For every other layout, layout wins.
  var _lk = window.DeckLayouts && window.DeckLayouts.LAYOUT_KEYS && window.DeckLayouts.LAYOUT_KEYS[slide.layout];
  if (slide.layout && slide.els && !(_lk && _lk.indexOf('els') > -1)) { warn('has both layout and els -- layout takes precedence'); delete slide.els; }

  if (slide.title && slide.title.length > maxTitle) {
    warn('title exceeds ' + maxTitle + ' chars -- truncating');
    slide.title = slide.title.substring(0, maxTitle - 3) + '...';
  }
  if (slide.els) { slide.els = slide.els.map(function (el) { return validateElement(el, slide, index); }); }

// A negative width or height is invalid in the exported XML -- PowerPoint
// rejects the file outright and offers to repair it, with no clue which shape
// caused it. Catch it at dispatch, where the layout name is still known.
function assertNonNegative(el, layout) {
  if ((el.w != null && el.w < 0) || (el.h != null && el.h < 0)) {

// Filled rounded-rectangle path. r is clamped so a short bar collapses to a
// lozenge rather than inverting.
function barRoundPath(ctx, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);

function renderBarChart(ctx, data, opts, cw, ch, isDark) {
  if (!data.length || !data[0].values) return;
  var series = data; var labels = series[0].labels || [];
  var nGroups = labels.length; var nSeries = series.length; var maxVal = 0;
  series.forEach(function (s) { s.values.forEach(function (v) { if (v > maxVal) maxVal = v; }); });
  if (maxVal === 0) maxVal = 1;
  // barDir 'bar' (the export default) is HORIZONTAL; 'col' is vertical. Both
  // draw with full pill ends -- the source template's square bars are a defect
  // vs the Keynote original (see roundChartBars in deck-shell.js for the PPTX).
  var horiz = (opts.barDir || 'bar') === 'bar';
  var colors = resolveChartColors(opts.chartColors || null, nSeries, isDark);
  var padding = { top: 60, right: 40, bottom: 50, left: horiz ? 92 : 60 };
  var plotW = cw - padding.left - padding.right; var plotH = ch - padding.top - padding.bottom;
  ctx.font = ptToPx(8) + 'px Mazda Type, Arial, sans-serif';

        var r = (barH - 2) / 2;

      });
    });
    ctx.fillStyle = resolveColor('muted', isDark); ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    labels.forEach(function (lbl, i) { ctx.fillText(lbl, padding.left - 14, padding.top + i * groupH + groupH / 2); });
    ctx.textBaseline = 'alphabetic';
  } else {
    var groupW = plotW / nGroups; var barW = (groupW * 0.7) / nSeries; var gap = groupW * 0.3;
    series.forEach(function (s, si) {
      s.values.forEach(function (val, vi) {
        var bx = padding.left + vi * groupW + gap / 2 + si * barW;
        var r = (barW - 2) / 2;
        var bh = Math.max((val / maxVal) * plotH, r * 2); var by = padding.top + plotH - bh;
        ctx.fillStyle = colors[si];
        barRoundPath(ctx, bx, by, barW - 2, bh, r); ctx.fill();
        if (opts.showValue) {
          ctx.font = '500 ' + ptToPx(8) + 'px Mazda Type, Arial, sans-serif';
          ctx.fillStyle = resolveColor('title', isDark); ctx.textAlign = 'center';
          ctx.fillText(formatVal(val), bx + barW / 2, by - 6);
          ctx.font = ptToPx(8) + 'px Mazda Type, Arial, sans-serif';

    });

    labels.forEach(function (lbl, i) { ctx.fillText(lbl, padding.left + i * groupW + groupW / 2, ch - padding.bottom + 20); });
  }
}

function renderLineChart(ctx, data, opts, cw, ch, isDark, isArea) {
  if (!data.length || !data[0].values) return;
  var series = data; var labels = series[0].labels || [];
  var nPoints = labels.length; var maxVal = 0;
  series.forEach(function (s) { s.values.forEach(function (v) { if (v > maxVal) maxVal = v; }); });
  if (maxVal === 0) maxVal = 1;
  var padding = { top: 60, right: 40, bottom: 50, left: 60 };
  var plotW = cw - padding.left - padding.right; var plotH = ch - padding.top - padding.bottom;
  var colors = resolveChartColors(opts.chartColors || null, series.length, isDark);
  series.forEach(function (s, si) {
    ctx.beginPath(); ctx.strokeStyle = colors[si]; ctx.lineWidth = 3;
    s.values.forEach(function (val, vi) {
      var px = padding.left + (vi / (nPoints - 1 || 1)) * plotW;
      var py = padding.top + plotH - (val / maxVal) * plotH;
      if (vi === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    });

      ctx.lineTo(padding.left + plotW, padding.top + plotH);
      ctx.lineTo(padding.left, padding.top + plotH); ctx.closePath();

    }

      var py = padding.top + plotH - (val / maxVal) * plotH;

  ctx.fillStyle = resolveColor('muted', isDark); ctx.textAlign = 'center';
  labels.forEach(function (lbl, i) { ctx.fillText(lbl, padding.left + (i / (nPoints - 1 || 1)) * plotW, ch - padding.bottom + 20); });
}

function renderPieChart(ctx, data, opts, cw, ch, isDark, isDoughnut) {
  if (!data.length || !data[0].values) return;
  var values = data[0].values; var labels = data[0].labels || [];
  var total = values.reduce(function (a, b) { return a + b; }, 0);
  if (total === 0) return;
  // opts.pieScale: radius as a fraction of the frame's short side. 0.35 leaves
  // room for a legend below; the MMW doughnut well (no legend) uses ~0.49.
  var cx = cw / 2; var cy = ch / 2; var radius = Math.min(cw, ch) * (opts.pieScale || 0.35);
  var hole = isDoughnut ? radius * ((opts.holeSize || 70) / 100) : 0;
  var colors = resolveChartColors(opts.chartColors || null, values.length, isDark);
  var startAngle = -Math.PI / 2;
  values.forEach(function (val, i) {
    var sliceAngle = (val / total) * Math.PI * 2; var endAngle = startAngle + sliceAngle;
    ctx.beginPath(); ctx.arc(cx, cy, radius, startAngle, endAngle);
    if (isDoughnut) ctx.arc(cx, cy, hole, endAngle, startAngle, true); else ctx.lineTo(cx, cy);
    ctx.closePath(); ctx.fillStyle = colors[i % colors.length]; ctx.fill();
    if (opts.showPercent !== false || opts.showLabel) {
      var midAngle = startAngle + sliceAngle / 2;
      var labelR = isDoughnut ? (radius + hole) / 2 : radius * 0.65;
      var lx = cx + Math.cos(midAngle) * labelR; var ly = cy + Math.sin(midAngle) * labelR;
      var fpx = ptToPx(opts.dataLabelFontSize || 9);
      ctx.font = '500 ' + fpx + 'px Mazda Type, Arial, sans-serif';
      ctx.fillStyle = opts.dataLabelColor ? resolveColor(opts.dataLabelColor, isDark) : '#FFFFFF';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      // Category name over percent, as the source doughnut labels its slices.
      var pct = Math.round((val / total) * 100) + '%';
      if (opts.showLabel && labels[i] != null) {
        ctx.fillText(String(labels[i]), lx, ly - fpx * 0.55);
        if (opts.showPercent !== false) ctx.fillText(pct, lx, ly + fpx * 0.55);
      } else ctx.fillText(pct, lx, ly);

    var legendY = cy + radius + 30;
    ctx.font = ptToPx(8) + 'px Mazda Type, Arial, sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    labels.forEach(function (lbl, i) {
      var lx = 40 + i * (cw / labels.length);
      ctx.fillStyle = colors[i % colors.length]; ctx.fillRect(lx, legendY, 12, 12);
      ctx.fillStyle = resolveColor('body', isDark); ctx.fillText(lbl, lx + 18, legendY);

function resolveChartColors(tokens, count, isDark) {
  var ramp = isDark ? CHART_SERIES : CHART_SERIES_LIGHT;
  var colors = [];
  for (var i = 0; i < count; i++) {
    if (tokens && tokens[i % tokens.length]) colors.push(resolveColor(tokens[i % tokens.length], isDark));
    else colors.push(ramp[i % ramp.length]);

}

function formatVal(v) {
  if (v >= 1000000) return (v / 1000000).toFixed(1) + 'M';
  if (v >= 1000) return (v / 1000).toFixed(1) + 'K';
  if (v % 1 !== 0) return v.toFixed(1);
  return v.toString();
}

// ============================================================
// TABLE RENDERER
// ============================================================

function renderTable(el, isDark) {
  var container = document.createElement('div');
  container.style.cssText = 'position:absolute;overflow:hidden;';
  container.style.left = toX(el.x) + 'px'; container.style.top = toY(el.y) + 'px';
  container.style.width = toX(el.w) + 'px'; container.style.height = toY(el.h) + 'px';
  var table = document.createElement('table');
  table.style.cssText = 'width:100%;border-collapse:collapse;font-family:Mazda Type,Arial,sans-serif;font-size:' + ptToPx(10) + 'px;';
  var headers = el.headers || []; var rows = el.rows || []; var colW = el.colW;
  if (headers.length) {
    var thead = document.createElement('thead'); var tr = document.createElement('tr');
    headers.forEach(function (h, i) {
      var th = document.createElement('th'); th.textContent = h;
      th.style.cssText = 'padding:12px 16px;text-align:left;background:' + resolveColor('accent', isDark) + ';color:#FFFFFF;font-weight:500;border-bottom:2px solid ' + resolveColor('ltGray', isDark) + ';';

      var td = document.createElement('td'); td.textContent = cell;
      td.style.cssText = 'padding:10px 16px;border-bottom:1px solid ' + resolveColor('ltGray', isDark) + '44;color:' + resolveColor('body', isDark) + ';';
      tr.appendChild(td);

// ============================================================
// IMAGE RENDERER
// ============================================================

// Resolve an image element to its source URL. Brand marks are referenced by id
// (gi0/gi0w/gi1/gi1w); the artifact declares them as hidden <img id="..."> tags.
// getAttribute('src') -- not .src -- so the value matches the key used by the
// prefetch cache, which stores the path exactly as authored.
function resolveImgSrc(el) {
  if (!el) return null;
  if (el.src) return el.src;
  if (!el.ref) return null;
  var host = document.getElementById(el.ref);
  if (!host) return null;
  if (host.tagName === 'IMG') return host.getAttribute('src') || host.src || null;
  var inner = host.querySelector('img');
  return inner ? (inner.getAttribute('src') || inner.src || null) : null;
}

function renderImage(el) {
  var div = document.createElement('div');
  div.style.cssText = 'position:absolute;overflow:hidden;';
  div.style.left = toX(el.x) + 'px'; div.style.top = toY(el.y) + 'px';
  div.style.width = toX(el.w) + 'px'; div.style.height = toY(el.h) + 'px';
  // Do NOT mirror el.ref onto this div. The artifact's hidden <img> already owns
  // that id, and a duplicate makes getElementById() ambiguous for the exporter.
  if (el.ref) div.setAttribute('data-ref', el.ref);

  // image into the angular MMW motif). Points are fractions of the frame, so
  // percentages reproduce it at any size.

    div.style.clipPath = 'polygon(' + el.mask.map(function (p) {
      return (p[0] * 100).toFixed(3) + '% ' + (p[1] * 100).toFixed(3) + '%';
    }).join(',') + ')';

  if (src) {
    var img = document.createElement('img');
    img.src = src;
    // Cropped source (srcRect): scale the image up so the kept region fills the
    // frame, then offset it. 44% of the template's pictures are cropped, and
    // without this they show the wrong part of the artwork.
    if (el.crop) {

      // Photography supplied into a photo well should fill it (cover), matching
      // how the template crops its own images into these frames.
      img.style.cssText = 'width:100%;height:100%;object-fit:' + (el.fit || 'contain') + ';';

// STRUCTURAL SLIDE DETECTION
// ============================================================

// caller: reportStatRow fills the full canvas edge to edge, and a footer would

// ============================================================

function renderSlide(slideData, index) {
  var isDark = !!slideData.dark;
  var slide = document.createElement('div');

          font:'B', size:18, bold:true, color:'#C12638', caps:false, lineSpacing:1 },

    slide.style.backgroundSize = 'cover';
    slide.style.backgroundPosition = 'center';

  } else if (isStructuralSlide(slideData.layout)) {

      + 'font-size:' + ptToPx(7) + 'px;'
      + 'font-weight:400;'
      + 'letter-spacing:0.15em;'
      + 'text-transform:uppercase;'
      + 'color:' + mutedColor + ';'
      + 'font-family:Mazda Type,Arial,sans-serif;';

      + 'font-size:' + ptToPx(7) + 'px;'
      + 'font-weight:400;'
      + 'letter-spacing:0.15em;'
      + 'text-transform:uppercase;'
      + 'color:' + cfColor + ';'
      + 'font-family:Mazda Type,Arial,sans-serif;';

        + 'font-size:' + ptToPx(7) + 'px;'

        + 'color:' + cfColor + ';'

function renderAll(D, container) {
  container.innerHTML = '';
  D.forEach(function (slideData, i) {
    container.appendChild(renderSlide(validateSlide(slideData, i), i));
  });
}

// ============================================================
// ACCENT / COLOR MANAGEMENT
// ============================================================

function setAccent(nameOrHex, light, dark) {
  if (ACCENT_FAMILIES[nameOrHex]) {
    var fam = ACCENT_FAMILIES[nameOrHex];
    _accentLight = fam.light; _accentMid = fam.mid; _accentDark = fam.dark; _familyName = nameOrHex;

// ============================================================

var _contentFooter = 'Company Confidential';

function setFooter(text) {
  if (text === 'confidential') _footerText = 'S T R I C T L Y   C O N F I D E N T I A L';
  else if (text === 'date' || text === null) _footerText = null;

function setContentFooter(text) {
  if (text === false || text === 'none' || text === null) _contentFooter = null;
  else if (text === 'strict') _contentFooter = 'Strictly Confidential';
  else if (typeof text === 'string') _contentFooter = text;

function getContentFooter() { return _contentFooter; }

// ============================================================
// PPTX SAFE AREA
// ============================================================

var pptxSafeArea = {
  x: SD_CONST.SAFE_X_MIN, y: SD_CONST.SAFE_Y_MIN,
  w: SD_CONST.SAFE_W, h: SD_CONST.CONTENT_END - SD_CONST.SAFE_Y_MIN

// PUBLIC API

  resolveColor: resolveColor, colorForPptx: colorForPptx,

  FONT_MAP: FONT_MAP, LIMITS: LIMITS, MIN_SIZES: MIN_SIZES,
  SAFE: SAFE, SD_CONST: SD_CONST, SLIDE_W: SLIDE_W, SLIDE_H: SLIDE_H,

        sy += rowH;

  els.push({ type:'t', text:'\u203a', x:4.37, y:6.45, w:0.22, h:0.28, font:'B', size:17, color:'accent', bold:true, align:'center', valign:'middle', caps:false, lineSpacing:1 });

  return els;

// the third had bullets and no header. None of the three section headers
// were underlined (the engine had no underline support at all -- added in

// were plain rectangles. The connector line under "WE ARE HERE" was a
// 0.01in-wide filled rectangle standing in for a line, so it couldn't carry
// arrowheads.
//
// cfg.panels: array of 4 { tone:'dark'|'tan', icon, header, date, sections }
//   sections: array of 3 { label, items } -- items is a list where each
//   entry is a plain string (gray bullet) or { text, bold, color } for a
//   bullet that needs to stand out, e.g. an approval-deadline date.
// tone controls which of the two source treatments a column gets: 'dark'
// (asphalt header/icon, tan date text) or 'tan' (accentDim header/icon,
// asphalt date text) -- matches the source's one-tan-of-four column.
// ==========================================================
function layout_reportJourneyMap(cfg) {
  var els = [];
  var COL_X = [0.19, 3.47, 6.74, 10.02];
  var COL_W = 3.12;
  var SECTIONS_Y = [3.09, 4.24, 5.88];
  var SECTIONS_H = [0.94, 1.26, 0.93];
  var DEFAULT_LABELS = ['DELIVERABLES:', 'DEFINE REVIEW TIMELINE:', 'CLIENT REVIEWERS'];

  if (cfg.tag) els.push({ type:'t', text:cfg.tag || '', x:0.61, y:0.54, w:12.12, h:0.29, font:'B', size:14.5, color:'accentDim', valign:'bottom', caps:true, lineSpacing:0.9, insets:{l:0.035,t:0.035,r:0.035,b:0.035} });
  els.push({ type:'t', text:cfg.title || '', x:0.61, y:0.85, w:12.12, h:0.5, font:'H', size:24, color:'titleGray', caps:true, lineSpacing:1, charSpacing:2.64, insets:{l:0.035,t:0.035,r:0.035,b:0.035} });
  els.push({ type:'t', text:(typeof cfg.hereLabel === 'string' ? cfg.hereLabel : 'WE ARE HERE'), x:4.13, y:1.43, w:1.8, h:0.16, font:'B', size:10, color:'#8D7057', bold:true, align:'center', valign:'middle', caps:true, lineSpacing:1, charSpacing:1.7 });
  // Connector: a real line (was a 0.01in filled rectangle, which can't carry
  // arrowheads), 3pt raw / 2.0005 = 1.5pt, both ends arrowed per source.
  els.push({ type:'ln', x:5.03, y:1.69, w:0, h:0.29, color:'ltGray', weight:1.5, arrows:'both' });

  var panels = cfg.panels || [];
  COL_X.forEach(function (x, i) {
    var p = panels[i] || {};
    var isTan = p.tone === 'tan';
    var headerFill = isTan ? 'accentDim' : 'asphalt';
    var dateColor = isTan ? 'asphalt' : '#ECBE96';

    // Tan outline: a slightly larger tan panel sitting behind the current
    // column's header+white boxes, showing as a frame around them (10.04 x

    // read taller than the others -- the header and white boxes underneath

    // White body drawn BEFORE the header bar so the bar sits on top of it,

    // is later in the group than the white box, i.e. topmost). Drawing the
    // header first let the white box cover nearly all of it, hiding the
    // icon/header/date row entirely.
    els.push({ type:'s', x:x, y:2.17, w:COL_W, h:4.78, fill:'white' });
    // Header shape: 6.24 x 1.54 raw -> 3.12 x 0.77 engine (verified against
    // source -- already correct).
    els.push({ type:'s', x:x, y:2.09, w:COL_W, h:0.77, fill:headerFill });

    // Icon disc. p.icon is an icon NAME (compass, camera, ...) -> render the
    // glyph; a single char or number -> render as text; empty -> the column
    // index. Previously p.icon was always drawn as text, so an icon name
    // rendered as a clipped word fragment inside the 0.32in disc.
    els.push({ type:'o', x:x+0.37, y:2.32, w:0.32, h:0.32, fill:'gray' });
    var _pi = p.icon || '';
    if (/^[a-z][a-z0-9-]+$/.test(_pi)) {
      els.push({ type:'i', icon:_pi, x:x+0.435, y:2.385, w:0.19, h:0.19, color:'white' });

    }

    // Three sections: caps underlined header + bulleted body. A bullet item
    // can be a plain string (gray, standard weight) or { text, bold, color }

    var sections = p.sections || [];
    SECTIONS_Y.forEach(function (sy, si) {
      var sec = sections[si] || {};
      var label = sec.label || DEFAULT_LABELS[si];
      var items = sec.items || [];
      els.push({ type:'t', text:label, x:x+0.37, y:sy, w:2.39, h:0.16, font:'B', size:9, color:'black', bold:true, underline:true, caps:true, lineSpacing:1, charSpacing:1.1 });
      els.push({ type:'t', x:x+0.37, y:sy+0.2, w:2.39, h:SECTIONS_H[si]-0.2, font:'B', size:10, color:'gray', valign:'top', caps:false, lineSpacing:1.15,
        paras:items.map(function (it) {
          var plain = typeof it === 'string';
          return { runs:[{ text: plain ? it : (it.text || ''), bold: plain ? false : !!it.bold, color: plain ? 'gray' : (it.color || 'gray') }], bullet:true, marL:0.12, indent:-0.12 };
        }) });
    });
  });
  els.push({ type:'s', x:0.32, y:3.96, w:2.89, h:0.01, fill:'ltGray' }); // rule
  els.push({ type:'s', x:3.59, y:3.96, w:2.89, h:0.01, fill:'ltGray' }); // rule
  els.push({ type:'s', x:6.87, y:3.96, w:2.89, h:0.01, fill:'ltGray' }); // rule
  els.push({ type:'s', x:10.14, y:3.96, w:2.89, h:0.01, fill:'ltGray' }); // rule
  els.push({ type:'s', x:0.32, y:5.62, w:2.89, h:0.01, fill:'ltGray' }); // rule
  els.push({ type:'s', x:3.59, y:5.62, w:2.89, h:0.01, fill:'ltGray' }); // rule
  els.push({ type:'s', x:6.87, y:5.62, w:2.89, h:0.01, fill:'ltGray' }); // rule
  els.push({ type:'s', x:10.14, y:5.62, w:2.89, h:0.01, fill:'ltGray' }); // rule
  return els;
}

// ==========================================================
// LAYOUT: REPORT GATE STATUS (SLIDE 100)  ->  cfg.layout = "reportGateStatus"
// Template: "Report Gate Status (slide 100)"
// Source slide: 100   Background: solid #FFFFFF
// Set slideData.bgColor = "#FFFFFF" (engine honours bgColor on export + preview).
// HAND-AUTHORED: replaces a flat 32-slot cfg.items[] version. Fully rebuilt
// from the real source: the ribbon headers are PowerPoint's native
// "chevron" preset shape (adj=0.2004), not a generic rectangle -- verified
// by reading the shape XML directly, not guessed from appearance.
//
// cfg.gates: array of 6 { number, title, subhead, bullets }. number is a
// plain string ("1", "2", ...) rendered as "N. TITLE" on the ribbon.
// subhead is optional (the black caps box); bullets is an array of strings.
// cfg.dividers: array of up to 5 { label } "gate cleared" markers, one per
// gap between ribbons (2 gaps per row + return gap = 5 max). Pass fewer to
// only show some; omit cfg.dividers entirely to hide all of them.
// cfg.showConnector: false to hide the row1->row2 connector line (shown by
// default).
// ==========================================================
function layout_reportGateStatus(cfg) {
  var els = [];
  var COL_W = 3.954, ROW_H = 0.539, GAP = 0.07;
  var COL_X = [0.654, 0.654 + COL_W + GAP, 0.654 + (COL_W + GAP) * 2];
  var ROW_Y = [0.412, 3.693];
  var SUB_GAP = 0.233, SUB_H = 0.22, SUB_W = 3.149;
  var BULLET_GAP = 0.08;
  // Chevron polygon: PowerPoint's "chevron" preset, adj=0.2004 -- notch/point
  // depth = min(w,h) * adj. Left corners stay at x=0 (clean 90deg corners,
  // not cut on a diagonal); the notch tip is pulled inward from there. Right
  // corners stay at x=1-nd with the point tip at x=1. An earlier version of
  // this shape started the top/bottom edges at x=nd instead of x=0, which
  // both angled the corners AND put the "notch" outside the shape as a
  // leftward bulge instead of cutting into it -- fixed here.
  var ADJ = 0.2004;
  var depthFrac = (Math.min(COL_W, ROW_H) * ADJ);
  var nd = depthFrac / COL_W;
  var CHEVRON_PTS = [[0,0],[1-nd,0],[1,0.5],[1-nd,1],[0,1],[nd,0.5]];

  // Gate dividers pushed BEFORE the chevrons/gates below. Confirmed against
  // the source's actual per-instance Y positions: dividers sit just below
  // each row's ribbon (a ~0.12-0.2in gap), not centered on/overlapping it --
  // an earlier version of this wrongly centered the divider vertically on
  // the ribbon row, which pushed row 1's dividers above the canvas top.
  var DIV_W = 0.236, DIV_H = 1.771, DIV_TOP_GAP = 0.16;
  var GAP_CENTERS = [
    { x: COL_X[0] + COL_W + GAP / 2, y: ROW_Y[0] },
    { x: COL_X[1] + COL_W + GAP / 2, y: ROW_Y[0] },
    { x: COL_X[0] + COL_W + GAP / 2, y: ROW_Y[1] },
    { x: COL_X[1] + COL_W + GAP / 2, y: ROW_Y[1] },
    { x: COL_X[2] + COL_W + GAP / 2, y: ROW_Y[1] }
  ];
  var dividers = cfg.dividers || [];
  dividers.slice(0, 5).forEach(function (d, i) {
    var c = GAP_CENTERS[i]; if (!c) return;
    var dx0 = c.x - DIV_W / 2, dy0 = c.y + ROW_H + DIV_TOP_GAP;
    els.push({ type:'s', x:dx0, y:dy0, w:DIV_W, h:DIV_H, fill:'accentDim' });
    var cx = dx0 + DIV_W / 2, cy = dy0 + DIV_H / 2;
    els.push({ type:'t', text:d.label || d, x:cx - DIV_H / 2, y:cy - DIV_W / 2, w:DIV_H, h:DIV_W, font:'B', size:7, color:'white', bold:true, align:'center', valign:'middle', caps:true, lineSpacing:1, rotation:90 });
  });

  var gates = cfg.gates || [];
  var gateBottom = []; // per-column bottom Y of each row's content, for reference
  COL_X.forEach(function (colX, ci) {
    ROW_Y.forEach(function (rowY, ri) {
      var g = gates[ri * 3 + ci] || {};
      els.push({ type:'s', x:colX, y:rowY, w:COL_W, h:ROW_H, fill:'gray', points:CHEVRON_PTS });
      els.push({ type:'t', text:((g.number || (ri*3+ci+1)) + '. ' + (g.title || '')), x:colX + 0.27, y:rowY + 0.127, w:COL_W - 0.54, h:0.285, font:'B', size:13.5, color:'white', bold:true, valign:'middle', caps:true, lineSpacing:1 });
      var y = rowY + ROW_H + SUB_GAP;
      // Centered in the column's width beneath the chevron above it -- both
      // the subhead box and the bullets under it share this offset, so the
      // whole content block stays aligned as one unit. Previously only
      // colX (the column/chevron's own left edge) was used, which put all
      // the box's margin-from-column on the right side only.
      var subX = colX + (COL_W - SUB_W) / 2;
      if (g.subhead) {
        els.push({ type:'s', x:subX, y:y, w:SUB_W, h:SUB_H, fill:'#3A3A3A' });
        // Insets trimmed from the source's 0.104in to 0.05in to reclaim
        // width for the text without changing the box itself (box size is
        // correct per the source; this sandbox's Arial fallback for Mazda
        // Type is what's actually causing the wrap -- see note below).
        els.push({ type:'t', text:g.subhead, x:subX, y:y, w:SUB_W, h:SUB_H, font:'B', size:9, color:'white', bold:true, valign:'middle', caps:true, lineSpacing:1, insets:{l:0.05,t:0.035,r:0.05,b:0.035} });
        y += SUB_H + BULLET_GAP;
      }
      if (g.bullets && g.bullets.length) {
        els.push({ type:'t', x:subX, y:y, w:SUB_W, h:(ROW_Y[1] - ROW_Y[0]) - (y - rowY) - 0.1, font:'B', size:10, color:'black', valign:'top', caps:false, lineSpacing:1.15,
          insets:{l:0.104,t:0.035,r:0.104,b:0.035},
          paras:g.bullets.map(function (b) { return { runs:[{ text:b }], bullet:true, marL:0.12, indent:-0.12 }; }) });
      }
    });
  });

  // Gate dividers: comment kept with the code above where they're actually
  // pushed now (before the chevrons). Text is built as a normal horizontal
  // box (matches the source's own pre-rotation text properties -- middle
  // valign, horizontal direction) sized to the divider's visible HEIGHT,
  // then rotated 90deg in place so it reads vertically.

  // Connector: dotted-end line from the last ribbon of row 1 (its outward
  // point) down to the first ribbon of row 2 (its inward notch), held off
  // the ribbons by CONNECTOR_GAP rather than touching them. The horizontal
  // run sits just above row 2's chevrons (not halfway between the rows) so
  // it clears row 1's tan gate dividers, which extend down to ~2.88in --
  // the previous halfway placement cut straight through them.
  if (cfg.showConnector !== false) {
    var CONNECTOR_GAP = 0.12, ROW2_CLEARANCE = 0.1;
    var r1x = COL_X[2] + COL_W + CONNECTOR_GAP, r1y = ROW_Y[0] + ROW_H / 2;
    var r2x = COL_X[0] - CONNECTOR_GAP, r2y = ROW_Y[1] + ROW_H / 2;
    var midY = ROW_Y[1] - ROW2_CLEARANCE;
    els.push({ type:'ln', x:r1x, y:r1y, w:0.3, h:0, color:'black', weight:2, markerStyle:'dot', arrows:'start' });
    els.push({ type:'ln', x:r1x + 0.3, y:r1y, w:0, h:midY - r1y, color:'black', weight:2 });
    els.push({ type:'ln', x:r1x + 0.3, y:midY, w:r2x - 0.3 - (r1x + 0.3), h:0, color:'black', weight:2 });
    els.push({ type:'ln', x:r2x - 0.3, y:midY, w:0, h:r2y - midY, color:'black', weight:2 });
    els.push({ type:'ln', x:r2x - 0.3, y:r2y, w:0.3, h:0, color:'black', weight:2, markerStyle:'dot', arrows:'end' });
  }

  return els;
}

// 6 fixed steps in a 3-col x 2-row serpentine (row 2 is offset right of

  if (cfg.showConnector !== false) {

// Numbers auto-generate as 01, 02, 03... unless you supply one.
//
// CAPACITY: the list box gives 4.42in of inner height (4.63 less insets). A 30pt item costs 0.46in and
// a 15pt sub-bullet 0.23in, so 9 items with no subs, or fewer as subs are added.
// Overflow is dropped with a console warning rather than silently clipped.
function layout_tableOfContents(cfg) {
  var els = [];

// ==========================================================
// LAYOUT: REPORTGRAYCHART  ->  cfg.layout = "reportGrayChart"
// Variant of "Content Gray" -- chart well (template slides 83, 84, 85, 88)
// Background: solid #EEEEEE
// Set slideData.bgColor = "#EEEEEE".
// HAND-AUTHORED: the base layout is a bare chassis; this adds the well.
// ==========================================================
// Source ramp for hand-composed bar charts (matches standard-deck.js CHART_SERIES
// and the template's own chart parts). Dark chassis lightens the last stop.
var CHART_BARS_DARK  = ['#BFA588', '#808080', '#4A634D', '#7CA8C1', '#B3BDB6', '#E8E8E8'];
var CHART_BARS_LIGHT = ['#BFA588', '#808080', '#4A634D', '#416986', '#B3BDB6', '#262626'];

function _niceMax(v) {
  if (!(v > 0)) return 1;
  var mag = Math.pow(10, Math.floor(Math.log(v) / Math.LN10));
  return Math.ceil(v / mag) * mag;
}

// Horizontal grouped bar chart built from primitives so the pill ends survive
// export -- PowerPoint's chart renderer ignores series geometry, so a native
// <c:barChart> can only ever draw flat bars. Axis line, 5 gridlines, category
// labels, optional legend and tip value labels. Non-bar chart types still go
// through the native chart element (see the callers).
function chartBarEls(els, cfg, X, Y, W, H, dark) {
  var ch = cfg.chart || {};
  var data = (ch.data || []).filter(function (s) { return s && s.values && s.values.length; });
  if (!data.length) return;
  var opts = ch.opts || {};
  var labels = data[0].labels || data[0].values.map(function (_, i) { return String(i + 1); });
  var nG = labels.length, nS = data.length;
  var PAL = dark ? CHART_BARS_DARK : CHART_BARS_LIGHT;
  var axisCol = dark ? 'mutedGray' : 'bodyGray';
  var gridCol = dark ? '#3C3C3C' : '#D8D8D8';

  var rawMax = 0;
  data.forEach(function (s) { s.values.forEach(function (v) { if (+v > rawMax) rawMax = +v; }); });
  var step = _niceMax(rawMax / 5) || 1;
  var axisMax = step * Math.max(1, Math.ceil(rawMax / step));
  var nGrid = Math.max(1, Math.round(axisMax / step));

  var GL = 1.15, GB = 0.36;
  var showLeg = opts.showLegend && nS > 1;
  var GT = showLeg ? 0.40 : 0.06;
  var px = X + GL, py = Y + GT, pw = W - GL - 0.20, ph = H - GT - GB;

  // Gridlines + value-axis labels at each nice step.
  for (var g = 0; g <= nGrid; g++) {
    var gx = px + (pw * g) / nGrid;
    els.push({ type:'ln', x:gx, y:py, w:0, h:ph, color:gridCol, weight:0.75 });
    els.push({ type:'t', text:String(step * g), x:gx - 0.5, y:py + ph + 0.05,
      w:1.0, h:0.26, font:'B', size:8, color:axisCol, align:'center', valign:'top',
      caps:false, insets:{l:0.02,t:0.02,r:0.02,b:0.02} });
  }
  // Category axis (left rule).
  els.push({ type:'ln', x:px, y:py, w:0, h:ph, color:axisCol, weight:1 });

  var groupH = ph / nG, barH = (groupH * 0.74) / nS, pad = groupH * 0.13;
  labels.forEach(function (lbl, gi) {
    els.push({ type:'t', text:String(lbl), x:X, y:py + gi * groupH, w:GL - 0.14, h:groupH,
      font:'B', size:9.5, color:axisCol, align:'right', valign:'middle',
      caps:false, insets:{l:0.02,t:0.02,r:0.02,b:0.02} });
    data.forEach(function (s, si) {
      var v = +s.values[gi] || 0;
      var bw = Math.max((v / axisMax) * pw, barH);
      var by = py + gi * groupH + pad + si * barH;
      var fill = (nS === 1) ? PAL[gi % PAL.length] : PAL[si % PAL.length];
      els.push({ type:'s', x:px, y:by, w:bw, h:barH - 0.03, fill:fill, radius:'pill' });
      if (opts.showValue !== false) {
        els.push({ type:'t', text:String(v), x:px + bw + 0.09, y:by - 0.02, w:0.9, h:barH,
          font:'B', size:8, color:axisCol, align:'left', valign:'middle',
          caps:false, insets:{l:0.02,t:0.02,r:0.02,b:0.02} });
      }
    });
  });

  // Legend row.
  if (showLeg) {
    var lx = px;
    data.forEach(function (s, si) {
      els.push({ type:'s', x:lx, y:Y + 0.06, w:0.16, h:0.16, fill:PAL[si % PAL.length], radius:0.03 });
      var name = String(s.name || ('Series ' + (si + 1)));
      els.push({ type:'t', text:name, x:lx + 0.22, y:Y - 0.02, w:2.4, h:0.32, font:'B', size:8.5,
        color:axisCol, align:'left', valign:'middle', caps:false, insets:{l:0.02,t:0.02,r:0.02,b:0.02} });
      lx += 0.22 + Math.min(2.4, 0.09 * name.length + 0.4) + 0.25;
    });
  }
}

// ---------- Vertical columns (template slides 93/94) ----------
// Clustered columns from primitives, for the same reason as chartBarEls: real
// shapes keep their pill ends in PowerPoint, a native <c:barChart> cannot.
// Spacing is the source chart's own: gapWidth 219 (gap between clusters =
// 2.19 bar widths) and overlap -27 (0.27 bar widths between bars in a
// cluster). Series colours are the source's: ink, grey, Spark, Canopy, Tide
// -- ink being #262626 on light and #EEEEEE on dark, as on slides 93 / 94.
// The source shows no gridlines, value axis or value labels; opts.gridlines
// and opts.showValue opt back in.
var CHART_COLS_LIGHT = ['#262626', '#808080', '#BFA588', '#4A634D', '#416986', '#B3BDB6'];
var CHART_COLS_DARK  = ['#EEEEEE', '#808080', '#BFA588', '#4A634D', '#416986', '#B3BDB6'];
function chartColEls(els, cfg, X, Y, W, H, dark) {
  var ch = cfg.chart || {};
  var data = (ch.data || []).filter(function (s) { return s && s.values && s.values.length; });
  if (!data.length) return;
  var opts = ch.opts || {};
  var labels = data[0].labels || data[0].values.map(function (_, i) { return String(i + 1); });
  var nG = labels.length, nS = data.length;
  var PAL = dark ? CHART_COLS_DARK : CHART_COLS_LIGHT;
  var ink = dark ? '#EEEEEE' : '#262626', axisCol = dark ? 'mutedGray' : 'bodyGray';
  var gridCol = dark ? '#3C3C3C' : '#D8D8D8';
  var showLeg = opts.showLegend && nS > 1, grid = !!opts.gridlines;

  var rawMax = 0;
  data.forEach(function (s) { s.values.forEach(function (v) { if (+v > rawMax) rawMax = +v; }); });
  var step = _niceMax(rawMax / 5) || 1;
  var axisMax = grid ? step * Math.max(1, Math.ceil(rawMax / step)) : (rawMax || 1);

  var GL = grid ? 0.7 : 0.1, GB = 0.34, GT = (showLeg ? 0.34 : 0) + (opts.showValue ? 0.22 : 0.05);
  var px = X + GL, py = Y + GT, pw = W - GL - 0.1, ph = H - GT - GB;

  if (grid) {
    var nGrid = Math.max(1, Math.round(axisMax / step));
    for (var g = 1; g <= nGrid; g++) {
      var gy = py + ph - (ph * g) / nGrid;
      els.push({ type:'ln', x:px, y:gy, w:pw, h:0, color:gridCol, weight:0.75 });
      els.push({ type:'t', text:String(step * g), x:X, y:gy - 0.13, w:GL - 0.08, h:0.26, font:'B', size:8,
        color:axisCol, align:'right', valign:'middle', caps:false, insets:{l:0.02,t:0.02,r:0.02,b:0.02} });
    }
  }
  // Baseline.
  els.push({ type:'ln', x:px, y:py + ph, w:pw, h:0, color:axisCol, weight:1 });

  var groupW = pw / nG;
  var bw = groupW / (nS + 0.27 * (nS - 1) + 2.19), inner = bw * 0.27;
  var clusterW = nS * bw + (nS - 1) * inner;
  labels.forEach(function (lbl, gi) {
    var gx = px + gi * groupW + (groupW - clusterW) / 2;
    data.forEach(function (s, si) {
      var v = +s.values[gi] || 0;
      var bh = Math.max((v / axisMax) * ph, bw);   // never shorter than its own pill
      var bx = gx + si * (bw + inner);
      var fill = (nS === 1) ? PAL[0] : PAL[si % PAL.length];
      els.push({ type:'s', x:bx, y:py + ph - bh, w:bw, h:bh, fill:fill, radius:'pill' });
      if (opts.showValue) {
        els.push({ type:'t', text:String(v), x:bx - 0.3, y:py + ph - bh - 0.22, w:bw + 0.6, h:0.2,
          font:'B', size:7.5, color:axisCol, align:'center', valign:'bottom', caps:false,
          insets:{l:0,t:0,r:0,b:0} });
      }
    });
    els.push({ type:'t', text:String(lbl), x:px + gi * groupW, y:py + ph + 0.05, w:groupW, h:0.26,
      font:'B', size:9.5, color:ink, align:'center', valign:'top', caps:false,
      insets:{l:0.02,t:0.02,r:0.02,b:0.02} });
  });

  if (showLeg) {
    var lx = px;
    data.forEach(function (s, si) {
      els.push({ type:'s', x:lx, y:Y + 0.06, w:0.16, h:0.16, fill:PAL[si % PAL.length], radius:0.03 });
      var name = String(s.name || ('Series ' + (si + 1)));
      els.push({ type:'t', text:name, x:lx + 0.22, y:Y - 0.02, w:2.4, h:0.32, font:'B', size:8.5,
        color:axisCol, align:'left', valign:'middle', caps:false, insets:{l:0.02,t:0.02,r:0.02,b:0.02} });
      lx += 0.22 + Math.min(2.4, 0.09 * name.length + 0.4) + 0.25;
    });
  }
}

// ---------- Doughnut (template slides 82/88) ----------
// Native chart (data stays editable in PowerPoint), styled to the source:
// hole 75, category + percent labels in each slice, the source's six slice
// colours, no legend, and cfg.chart.title set in the centre of the ring in
// the display face (24pt engine = the source's 48pt). The source's last
// slice is #262626 -- invisible on the dark chassis, so it lifts to #5C5C5C
// (that slice's own outline colour in the source) there.
var DOUGHNUT_COLORS = ['#7CA8C1', '#C4A485', '#AFAFC1', '#4A634D', '#6D649F', '#262626'];
function chartDoughnutEls(els, cfg, X, Y, W, H, dark) {
  var ch = cfg.chart || {}, opts = {}, k;
  var cols = DOUGHNUT_COLORS.map(function (c) { return (dark && c === '#262626') ? '#5C5C5C' : c; });
  var base = { holeSize: 75, showLabel: true, showPercent: true, showValue: false, showLegend: false,
               chartColors: cols, dataLabelColor: '#FFFFFF', dataLabelFontSize: 10, pieScale: 0.49 };
  for (k in base) opts[k] = base[k];
  for (k in (ch.opts || {})) opts[k] = ch.opts[k];
  var D = Math.min(W, H);                      // square frame, centred in the well
  var fx = X + (W - D) / 2, fy = Y + (H - D) / 2;
  els.push({ type:'chart', x:fx, y:fy, w:D, h:D, chartType:'doughnut', data:ch.data || [], opts:opts });
  if (ch.title) {
    var hole = D * opts.pieScale * 2 * (opts.holeSize / 100) * 0.92;
    els.push({ type:'t', text:ch.title, x:fx + (D - hole) / 2, y:fy + (D - hole) / 2, w:hole, h:hole,
      font:'H', size:ch.title.length > 12 ? 16 : 24, color:'titleGray', align:'center', valign:'middle',
      caps:false, lineSpacing:1, insets:{l:0.04,t:0.04,r:0.04,b:0.04} });
  }
}

// ---------- The chart well shared by reportGrayChart / reportDarkChart ----------
// cfg.chart = { type, data, opts, title, subtitle, note }
//   type:  'bar' (horizontal, default) | 'column' | 'line' | 'area' | 'pie' | 'doughnut'
//          ('bar' with opts.barDir:'col' is accepted as 'column')
//   title / subtitle: small centred heading above the plot (slide 93's
//          "QoQ GVS by Model / (m953)"); for 'doughnut' the title sits in
//          the ring's centre instead.
//   note:  centred summary under the plot (slide 93's "Q1 GVS: ..."); a
//          string, '\n' for a second line.
function chartWellEls(els, cfg, dark) {
  var ch = cfg.chart || {};
  var type = ch.type || 'bar';
  if (type === 'bar' && ch.opts && ch.opts.barDir === 'col') type = 'column';
  var X = 0.78, W = 11.5, top = 2.22, bottom = 6.58;
  if (ch.title && type !== 'doughnut') {
    els.push({ type:'t', text:ch.title, x:X, y:top, w:W, h:0.24, font:'B', size:13, color:'bodyGray',
      align:'center', valign:'bottom', caps:false, lineSpacing:1, insets:{l:0,t:0,r:0,b:0} });
    top += 0.26;
    if (ch.subtitle) {
      els.push({ type:'t', text:ch.subtitle, x:X, y:top, w:W, h:0.2, font:'B', size:11, color:'bodyGray',
        align:'center', valign:'top', caps:false, lineSpacing:1, insets:{l:0,t:0,r:0,b:0} });
      top += 0.22;
    }
    top += 0.08;
  }
  if (ch.note) {
    // At the source's own position (slide 93: y 6.49); the plot then runs
    // down to just above it rather than stopping at the plain well's 6.58.
    var lines = String(ch.note).split('\n').length;
    var nh = 0.2 * lines + 0.04;
    els.push({ type:'t', text:ch.note, x:X, y:6.49, w:W, h:nh, font:'B', size:10, color:'bodyGray',
      align:'center', valign:'top', caps:false, lineSpacing:1.05, insets:{l:0,t:0,r:0,b:0} });
    bottom = 6.37;
  }
  var H = bottom - top;
  if (type === 'bar') chartBarEls(els, cfg, X, top, W, H, dark);
  else if (type === 'column') chartColEls(els, cfg, X, top, W, H, dark);
  else if (type === 'doughnut') chartDoughnutEls(els, cfg, X, top, W, H, dark);
  else els.push({ type:'chart', x:X, y:top, w:W, h:H, chartType:type,
    data:ch.data || [], opts:ch.opts || {} });
}

// Shared body for both table variants -- the only real differences between
// them are the header band's fill/text color, confirmed against the source.
function tableBody(cfg, theme) {
  var els = [];
  if (cfg.tag) els.push({ type:'t', text:cfg.tag, x:0.61, y:0.54, w:12.12, h:0.29,
    font:'B', size:14.5, color:'accentDim', valign:'bottom', caps:true, lineSpacing:0.9,
    insets:{l:0.035,t:0.035,r:0.035,b:0.035} });
  els.push({ type:'t', text:cfg.title || '', x:0.61, y:0.85, w:12.12, h:0.5,
    font:'H', size:24, color:'titleGray', caps:true, lineSpacing:1, charSpacing:2.64,
    insets:{l:0.035,t:0.035,r:0.035,b:0.035} });
  if (cfg.intro || cfg.text) els.push({ type:'t', text:cfg.intro || cfg.text, x:0.61, y:1.33, w:12.12, h:0.39,
    font:'B', size:10, color:'bodyGray', caps:false, lineSpacing:1.1,
    insets:{l:0.028,t:0.028,r:0.028,b:0.028} });

  var TBL_X = 0.64, TBL_Y = 2.04, COL1_W = 8.557, COL2_W = 3.498;
  var HEADER_H = 0.904, ROW_H = 0.955;
  var COL2_X = TBL_X + COL1_W;
  var DIVIDER = '#5E5E5E';

  var headers = cfg.headers || [];
  els.push({ type:'s', x:TBL_X, y:TBL_Y, w:COL1_W + COL2_W, h:HEADER_H, fill:theme.headerFill });
  // Header band + row headings + bullets are all Mazda Type Bold (+mj-lt) in
  // the source table, not Arial. Sizes/tracking/colors read from the cell XML:
  // header sz3400 b1, heading sz4000 b0 spc440 #CFB496, bullet sz1600 spc176
  // #919292 -- all halved into engine space.
  els.push({ type:'t', text:headers[0] || '', x:TBL_X + 0.13, y:TBL_Y, w:COL1_W - 0.26, h:HEADER_H,
    font:'H', size:17, color:theme.headerText, bold:true, valign:'middle', caps:true, lineSpacing:0.9 });
  els.push({ type:'t', text:headers[1] || '', x:COL2_X + 0.13, y:TBL_Y, w:COL2_W - 0.26, h:HEADER_H,
    font:'H', size:17, color:theme.headerText, bold:true, valign:'middle', caps:true, lineSpacing:0.9 });

  var rows = cfg.rows || [];
  function cell(x, w, y, h, content) {
    if (!content) return;
    var ty = y + 0.2;
    if (content.heading) {
      // Fit the heading to one line: the narrow right column wrapped
      // "LOREM IPSUM DOLOR" at 20pt and the second line ran into the bullets.
      // Step the size down (floor 12) so it fits the column width, then
      // advance past its ACTUAL height so the bullets clear it.
      var _hw = w - 0.26;
      var _hl = String(content.heading).length || 1;
      var _hs = Math.max(12, Math.min(20, Math.floor((_hw * 0.92) / (_hl * 0.01073))));
      var _lineH = _hs / 72 * 1.16;
      var _wraps = (_hl * _hs * 0.01073) > _hw ? 2 : 1;   // only at the 12pt floor
      els.push({ type:'t', text:content.heading, x:x + 0.13, y:ty, w:_hw, h:_lineH * _wraps + 0.05,
        font:'H', size:_hs, color:'#CFB496', caps:true, charSpacing:_hs / 20 * 2.2, lineSpacing:1 });
      ty += _lineH * _wraps + 0.08;
    }
    if (content.bullets && content.bullets.length) {
      els.push({ type:'t', x:x + 0.13, y:ty, w:w - 0.26, h:(y + h) - ty - 0.08,
        font:'H', size:8, color:'#919292', valign:'top', caps:true, lineSpacing:1.2, charSpacing:0.88,
        insets:{l:0,t:0,r:0,b:0},
        paras:content.bullets.map(function (b) { return { runs:[{ text:b }], bullet:true, marL:0.21, indent:-0.14 }; }) });
    }
  }

  var y = TBL_Y + HEADER_H;
  for (var i = 0; i < 4; i++) {
    var r = rows[i] || {};
    cell(TBL_X, COL1_W, y, ROW_H, r.left);
    cell(COL2_X, COL2_W, y, ROW_H, r.right);
    if (i < 3) els.push({ type:'s', x:TBL_X, y:y + ROW_H, w:COL1_W + COL2_W, h:0.0125, fill:DIVIDER });
    y += ROW_H;
  }
  // Vertical divider between the two columns, full table height.
  els.push({ type:'s', x:COL2_X, y:TBL_Y, w:0.0125, h:HEADER_H + ROW_H * 4, fill:DIVIDER });

  return els;
}

// LAYOUT: REPORT CHANNEL MATRIX (SLIDE 78)  ->  cfg.layout = "reportChannelMatrix"
// Variant of "Content Gray" -- funnel/channel role & budget matrix
// Background: solid #EEEEEE
// Set slideData.bgColor = "#EEEEEE".
// HAND-AUTHORED, NEW: previously conflated with reportGrayTable (both cite
// "Content Gray"), but this is a genuinely different table object in the
// source (14 rows x 6 cols with a 2-row header, merged group-label cells,
// a subtotal row, and a grand-total row) -- confirmed by reading the real
// table's cell grid, merges and fills directly, not assumed from a visual
// resemblance to the simpler 2-column report table.
//
// cfg.headerTotals: { basePlanOnly, basePlanIncremental } -- the two $
// values shown in the header band itself (row 2 of the header).
// cfg.groups: array of { label, rows: [ { channel, base, incremental,
//   baseValue, incValue } ], subtotal: { baseValue, incValue } }.
//   subtotal is optional per group; omit for a group with no subtotal bar.
// cfg.grandTotal: { baseValue, incValue }.
// ==========================================================
function layout_reportChannelMatrix(cfg) {
  var els = [];
  if (cfg.tag) els.push({ type:'t', text:cfg.tag, x:0.61, y:0.54, w:12.12, h:0.29,
    font:'B', size:14.5, color:'accentDim', valign:'bottom', caps:true, lineSpacing:0.9,
    insets:{l:0.035,t:0.035,r:0.035,b:0.035} });
  els.push({ type:'t', text:cfg.title || '', x:0.61, y:0.85, w:12.12, h:0.5,
    font:'H', size:24, color:'titleGray', caps:true, lineSpacing:1, charSpacing:2.64,
    insets:{l:0.035,t:0.035,r:0.035,b:0.035} });
  if (cfg.intro || cfg.text) els.push({ type:'t', text:cfg.intro || cfg.text, x:0.61, y:1.33, w:12.12, h:0.39,
    font:'B', size:10, color:'bodyGray', caps:false, lineSpacing:1.1,
    insets:{l:0.028,t:0.028,r:0.028,b:0.028} });

  var TBL_X = 0.59, TBL_Y = 1.842;
  var COL_W = [1.385, 1.361, 3.397, 3.654, 1.082, 1.272];
  var COL_X = [TBL_X];
  for (var c = 0; c < COL_W.length - 1; c++) COL_X.push(COL_X[c] + COL_W[c]);
  var HEAD_H = [0.385, 0.375];
  var ROW_H = 0.38, SUBTOTAL_H = 0.385, GRAND_H = 0.375;
  var DARK = '#262626';

  function txt(x, w, y, h, text, opts) {
    var _t = (text == null || text === '') ? '' : String(text); // baseValue/incValue arrive numeric
    var o = Object.assign({ type:'t', text:_t, x:x + 0.09, y:y, w:w - 0.18, h:h,
      font:'B', size:6, valign:'middle', lineSpacing:1, caps:true }, opts || {});
    els.push(o);
  }

  // Header, 2 rows: FUNNEL & MESSAGING / CHANNEL each span both rows;
  // ROLE OF CHANNEL spans row 0 across BASE PLAN + INCREMENTAL's width,
  // then splits into those two labels on row 1; the last two columns show
  // a header-level total on row 1 under their row-0 labels.
  var headerBottom = TBL_Y + HEAD_H[0] + HEAD_H[1];
  els.push({ type:'s', x:TBL_X, y:TBL_Y, w:COL_W.reduce(function(a,b){return a+b;},0), h:HEAD_H[0]+HEAD_H[1], fill:DARK });
  txt(COL_X[0], COL_W[0], TBL_Y, HEAD_H[0]+HEAD_H[1], 'FUNNEL & MESSAGING', { color:'white', bold:true, valign:'bottom' });
  txt(COL_X[1], COL_W[1], TBL_Y, HEAD_H[0]+HEAD_H[1], 'CHANNEL', { color:'white', bold:true, valign:'bottom' });
  txt(COL_X[2], COL_W[2]+COL_W[3], TBL_Y, HEAD_H[0], 'ROLE OF CHANNEL', { color:'white', bold:true, valign:'bottom' });
  txt(COL_X[2], COL_W[2], TBL_Y + HEAD_H[0], HEAD_H[1], 'BASE PLAN', { color:'white', bold:true, valign:'bottom' });
  txt(COL_X[3], COL_W[3], TBL_Y + HEAD_H[0], HEAD_H[1], 'INCREMENTAL', { color:'white', bold:true, valign:'bottom' });
  var ht = cfg.headerTotals || {};
  txt(COL_X[4], COL_W[4], TBL_Y, HEAD_H[0], 'Base Plan Only', { color:'white', bold:true, valign:'bottom', size:6 });
  txt(COL_X[4], COL_W[4], TBL_Y + HEAD_H[0], HEAD_H[1], ht.basePlanOnly || '$0M', { color:'white', bold:true });
  txt(COL_X[5], COL_W[5], TBL_Y, HEAD_H[0], 'Base Plan + $18MM Incremental*', { color:'white', bold:true, valign:'bottom', size:6, lineSpacing:0.95 });
  txt(COL_X[5], COL_W[5], TBL_Y + HEAD_H[0], HEAD_H[1], ht.basePlanIncremental || '$0M', { color:'white', bold:true });
  // Column dividers across the whole header band.
  [1,2,3,4,5].forEach(function (ci) {
    els.push({ type:'s', x:COL_X[ci], y:TBL_Y, w:0.0125, h:HEAD_H[0]+HEAD_H[1], fill:'#5E5E5E' });
  });

  // Body groups.
  var groups = cfg.groups || [];
  var y = headerBottom;
  var tableRight = TBL_X + COL_W.reduce(function(a,b){return a+b;},0);
  groups.forEach(function (g) {
    var rows = g.rows || [];
    var groupTop = y;
    rows.forEach(function (r) {
      txt(COL_X[1], COL_W[1], y, ROW_H, r.channel, { color:'#CFB496', charSpacing:0.9 });
      txt(COL_X[2], COL_W[2], y, ROW_H, r.base, { color:'#808080', bold:false, caps:false, lineSpacing:1.1 });
      txt(COL_X[3], COL_W[3], y, ROW_H, r.incremental, { color:'#808080', bold:false, caps:false, lineSpacing:1.1 });
      txt(COL_X[4], COL_W[4], y, ROW_H, r.baseValue, { color:'#CFB496' });
      txt(COL_X[5], COL_W[5], y, ROW_H, r.incValue, { color:'#CFB496' });
      els.push({ type:'s', x:TBL_X, y:y + ROW_H, w:tableRight - TBL_X, h:0.0125, fill:'#D9D9D9' });
      y += ROW_H;
    });
    var groupH = y - groupTop;
    txt(COL_X[0], COL_W[0], groupTop, groupH, g.label, { color:'#262626', bold:true, valign:'middle' });
    [2,3,4,5].forEach(function (ci) {
      els.push({ type:'s', x:COL_X[ci], y:groupTop, w:0.0125, h:groupH, fill:'#D9D9D9' });
    });
    if (g.subtotal) {
      els.push({ type:'s', x:TBL_X, y:y, w:tableRight - TBL_X, h:SUBTOTAL_H, fill:DARK });
      txt(COL_X[4], COL_W[4], y, SUBTOTAL_H, g.subtotal.baseValue, { color:'white', bold:true });
      txt(COL_X[5], COL_W[5], y, SUBTOTAL_H, g.subtotal.incValue, { color:'white', bold:true });
      y += SUBTOTAL_H;
    }
  });

  // Grand total: label spans the first four columns.
  els.push({ type:'s', x:TBL_X, y:y, w:tableRight - TBL_X, h:GRAND_H, fill:DARK });
  txt(TBL_X, COL_W[0]+COL_W[1]+COL_W[2]+COL_W[3], y, GRAND_H, 'GRAND TOTALS', { color:'white', bold:true });
  var gt = cfg.grandTotal || {};
  txt(COL_X[4], COL_W[4], y, GRAND_H, gt.baseValue || '$0M', { color:'white', bold:true });
  txt(COL_X[5], COL_W[5], y, GRAND_H, gt.incValue || '$0M', { color:'white', bold:true });

  return els;
}

function dispatch(slideData) {

  // this system's "cfg.foo" shorthand, which means "the slide object's foo",
  // not a literal nested key. Every layout fn reads slideData.foo directly, so
  // an un-hoisted cfg wrapper renders the slide almost empty (title only).
  // Hoist cfg's keys onto the slide; a key already on the slide wins; then drop
  // the wrapper so warnUnusedKeys doesn't flag it. Idempotent across the
  // several dispatch() passes per slide.

      if (Object.prototype.hasOwnProperty.call(slideData.cfg, _k) && slideData[_k] === undefined) {
        slideData[_k] = slideData.cfg[_k];

    delete slideData.cfg;
  }

  if (fn) {
    var slug = slideData.layout;
    if (!LAYOUT_KEYS[slug]) {
      slug = RETIRED[slideData.layout] || LEGACY_ALIASES[slideData.layout] || TEMPLATE_NAMES[slideData.layout] || slug;
    }
    warnUnusedKeys(slideData, slug);
    return fitTexts(fn(slideData), slug);
  }
  if (slideData.els) return slideData.els;
  console.error('[deck-layouts] Unknown layout: "' + slideData.layout + '". ' +
    'This build (' + VERSION + ') knows ' + Object.keys(LAYOUT_MAP).length +
    ' layouts. If this name looks correct, your deck-layouts.js is out of date.');
  return errorSlide('Unknown layout: "' + slideData.layout + '"',
    'This build is ' + VERSION + '. If the name looks right, deck-layouts.js is stale -- ' +
    'hard-refresh, or check DeckLayouts.VERSION in the console.');

<script>/* ---- deck-maps.js ---- */
/* ============================================================
deck-maps.js -- US map layout (mapUS) for standard-deck-mmw

Loads AFTER deck-layouts.js and map-data.js. Registers one layout,
`mapUS`, into DeckLayouts. Two styles, both taken from the template's own
map slide (7/30/26 template, slide 114):
  style:'solid'  states as filled shapes (template: grey land)
  style:'dots'   a dot grid over the land (template: dotted world map)
Highlighted states turn Spark tan (#BFA588) in either style. Cities get a
marker and a label; labels are placed to avoid each other and the markers,
and fall back to a leader line when nothing fits next to the marker.

Solid-style states export to PPTX as real freeform shapes (one per state,
or per island), so a user can still click a state in PowerPoint and recolour
it by hand.

Geometry is generated -- see tools/build_us_map.js. This file is hand-written.
============================================================ */
(function () {
'use strict';

var DL = window.DeckLayouts;
var DATA = window.MMW_MAP_DATA && window.MMW_MAP_DATA.us;
if (!DL) { console.error('[deck-maps] deck-layouts.js must load first.'); return; }
if (!DATA) { console.error('[deck-maps] map-data.js must load before deck-maps.js.'); return; }

// ------------------------------------------------------------
// Lookups
// ------------------------------------------------------------
var STATE_BY = {};          // 'CA' and 'california' -> state record
DATA.states.forEach(function (s) { STATE_BY[s.id] = s; STATE_BY[s.n.toLowerCase()] = s; });
function findState(v) {
  if (!v) return null;
  var k = String(v).trim();
  return STATE_BY[k.toUpperCase()] || STATE_BY[k.toLowerCase()] || null;
}

// Cities: name -> list, most populous first (the build sorts by population).
var CITY_BY = {};
DATA.cities.forEach(function (c) {
  var k = c[0].toLowerCase();
  (CITY_BY[k] = CITY_BY[k] || []).push(c);
});

// Albers USA, matching d3.geoAlbersUsa().scale(1300).translate([487.5,305])
// -- the projection the geometry was built with. Verified against d3 to the
// hundredth of a unit for the lower 48; Alaska and Hawaii use d3's insets.
var RAD = Math.PI / 180;
function conic(par0, par1, rot, cLon, cLat, scale, tx, ty) {
  var p0 = par0 * RAD, p1 = par1 * RAD, n = (Math.sin(p0) + Math.sin(p1)) / 2;
  var C = 1 + Math.sin(p0) * (2 * n - Math.sin(p0)), r0 = Math.sqrt(C) / n;
  function raw(l, f) { var r = Math.sqrt(C - 2 * n * Math.sin(f)) / n; return [r * Math.sin(l * n), r0 - r * Math.cos(l * n)]; }
  var c = raw(cLon * RAD, cLat * RAD);
  return function (lon, lat) {
    var p = raw((lon + rot) * RAD, lat * RAD);
    return [tx + scale * (p[0] - c[0]), ty - scale * (p[1] - c[1])];
  };
}
var K = 1300, TX = 487.5, TY = 305;
var LOWER48 = conic(29.5, 45.5, 96, -0.6, 38.7, K, TX, TY);
var ALASKA  = conic(55, 65, 154, -2, 58.5, 0.35 * K, TX - 0.307 * K, TY + 0.201 * K);
var HAWAII  = conic(8, 18, 157, -3, 19.9, K, TX - 0.205 * K, TY + 0.212 * K);
function project(lon, lat) {
  if (lat > 50 && lon < -129) return ALASKA(lon, lat);
  if (lat < 23 && lon < -150) return HAWAII(lon, lat);
  return LOWER48(lon, lat);
}

// A city entry is {name, state?} (looked up) or {name, lat, lon} (projected).
function resolveCity(c) {
  if (typeof c === 'string') c = { name: c };
  if (!c || !c.name) return null;
  var out = { label: c.label || c.name, note: c.note || '' };
  if (typeof c.lat === 'number' && typeof c.lon === 'number') {
    var p = project(c.lon, c.lat); out.x = p[0]; out.y = p[1]; return out;
  }
  var list = CITY_BY[String(c.name).toLowerCase()];
  if (list && c.state) {
    var st = findState(c.state);
    list = list.filter(function (r) { return st && r[1] === st.id; });
  }
  if (!list || !list.length) {
    console.warn('[deck-maps] mapUS: no city "' + c.name + '"' + (c.state ? ' (' + c.state + ')' : '') +
      ' in the bundled list -- pass lat/lon for it. Skipped.');
    return null;
  }
  out.x = list[0][2]; out.y = list[0][3];
  return out;
}

// ------------------------------------------------------------
// Frame
// ------------------------------------------------------------
var BBOX = (function () {
  var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  DATA.states.forEach(function (s) { s.r.forEach(function (r) {
    for (var i = 0; i < r.length; i += 2) {
      if (r[i] < x0) x0 = r[i]; if (r[i] > x1) x1 = r[i];
      if (r[i + 1] < y0) y0 = r[i + 1]; if (r[i + 1] > y1) y1 = r[i + 1];
    }
  }); });
  return { x0: x0, y0: y0, x1: x1, y1: y1 };
})();

// Template pin (Google Shape 3337 on slide 114), bezier outline flattened to
// box fractions. Aspect 0.68 (452852 x 666401 EMU); tip at x=0.482, y=1.
var PIN_PTS = [[0.498,0],[0.418,0.004],[0.341,0.017],[0.27,0.038],[0.204,0.066],[0.146,0.099],[0.096,0.139],[0.056,0.183],[0.025,0.232],[0.007,0.284],[0,0.339],[0.004,0.369],[0.014,0.403],[0.03,0.438],[0.048,0.473],[0.069,0.507],[0.089,0.538],[0.108,0.565],[0.123,0.586],[0.133,0.6],[0.137,0.605],[0.482,1],[0.839,0.609],[0.844,0.604],[0.856,0.591],[0.874,0.571],[0.896,0.545],[0.92,0.514],[0.943,0.48],[0.965,0.444],[0.983,0.408],[0.996,0.372],[1,0.339],[0.993,0.284],[0.974,0.232],[0.944,0.183],[0.903,0.139],[0.853,0.099],[0.795,0.066],[0.729,0.038],[0.657,0.017],[0.58,0.004]];
var PIN_H = 0.21, PIN_W = PIN_H * 0.68, PIN_TIP = 0.482;

// Map area below the report chassis (same chassis as reportGray/reportDark).
var AREA = { x: 0.61, y: 1.92, w: 12.12, h: 5.13 };

function frame() {
  var bw = BBOX.x1 - BBOX.x0, bh = BBOX.y1 - BBOX.y0;
  var k = Math.min(AREA.w / bw, AREA.h / bh);

// ------------------------------------------------------------

  // author's order is the priority order.

// ------------------------------------------------------------
// Layout
// ------------------------------------------------------------
function layout_mapUS(cfg) {
  // Light report chassis unless the deck says otherwise.
  if (!cfg.bgColor && !cfg.bgImage && cfg.dark === undefined) { cfg.bgColor = '#EEEEEE'; cfg.dark = 0; }
  var els = [];
  var dark = cfg.dark === 1;
  var BG = dark ? '#262626' : '#EEEEEE';
  var LAND = dark ? '#808080' : '#CCCCCC';        // solid: template's grey land
  var DOT = dark ? '#5E5E5E' : '#C2C2C2';         // dots: muted base
  var HI = '#BFA588';                             // Spark (accentDim) -- the template's map tan
  var INK = dark ? '#EEEEEE' : '#262626';
  var SUB = dark ? '#868686' : '#808080';

  // Chassis -- identical to reportGray / reportDark.
  if (cfg.tag) els.push({ type:'t', text:cfg.tag, x:0.61, y:0.54, w:12.12, h:0.29,
    font:'B', size:14.5, color:'accentDim', valign:'bottom', caps:true, lineSpacing:0.9,
    insets:{l:0.035,t:0.035,r:0.035,b:0.035} });
  els.push({ type:'t', text:cfg.title || '', x:0.61, y:0.85, w:12.12, h:0.5,
    font:'H', size:24, color:'titleGray', caps:true, lineSpacing:1, charSpacing:2.64,
    insets:{l:0.035,t:0.035,r:0.035,b:0.035} });
  if (cfg.intro || cfg.text) els.push({ type:'t', text:cfg.intro || cfg.text, x:0.61, y:1.33, w:12.12, h:0.39,
    font:'B', size:10, color:'bodyGray', caps:false, lineSpacing:1.1,
    insets:{l:0.028,t:0.028,r:0.028,b:0.028} });

  var F = frame();

    var s = findState(h);
    if (s) hiSet[s.id] = 1;
    else console.warn('[deck-maps] mapUS: unknown state "' + h + '" in highlight -- use a postal code (CA) or name.');
  });

  if (cfg.style === 'dots') {
    var dia = DATA.dotSpacing * F.k * 0.62;
    for (var i = 0; i < DATA.dots.length; i += 3) {
      var st = DATA.states[DATA.dots[i + 2]];
      els.push({ type:'o', x:F.X(DATA.dots[i]) - dia / 2, y:F.Y(DATA.dots[i + 1]) - dia / 2,
        w:dia, h:dia, fill: hiSet[st.id] ? HI : DOT });
    }
  } else {
    DATA.states.forEach(function (s) {
      s.r.forEach(function (r) {
        var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, j;
        for (j = 0; j < r.length; j += 2) {
          var X = F.X(r[j]), Y = F.Y(r[j + 1]);
          if (X < x0) x0 = X; if (X > x1) x1 = X; if (Y < y0) y0 = Y; if (Y > y1) y1 = Y;
        }
        var w = Math.max(x1 - x0, 0.001), h = Math.max(y1 - y0, 0.001), pts = [];
        for (j = 0; j < r.length; j += 2) {
          pts.push([+((F.X(r[j]) - x0) / w).toFixed(4), +((F.Y(r[j + 1]) - y0) / h).toFixed(4)]);
        }
        els.push({ type:'s', x:x0, y:y0, w:w, h:h, points:pts,
          fill: hiSet[s.id] ? HI : LAND, stroke: BG, strokeWidth: 0.6 });
      });

  }

  // Cities: marker + label.
  var NAME_PT = 8, NOTE_PT = 7, TRACK = 0.6;
  var pts = [], raw = [];
  (cfg.cities || []).forEach(function (c) { var r = resolveCity(c); if (r) raw.push(r); });

  // wide, overlapping teardrops are worse than dots. Switch the WHOLE map, so
  // markers stay consistent. cfg.marker forces either.

  if (marker !== 'pin' && marker !== 'dot') {
    marker = 'pin';
    for (var a = 0; a < raw.length && marker === 'pin'; a++) for (var b = a + 1; b < raw.length; b++) {
      if (Math.hypot(F.X(raw[a].x) - F.X(raw[b].x), F.Y(raw[a].y) - F.Y(raw[b].y)) < PIN_W * 1.15) { marker = 'dot'; break; }

  // leader never crosses a marker or a name.

    els.push({ type:'t', text:p.label, x:dx, y:r.y, w:dw, h:0.17, font:'B', size:NAME_PT, color:INK,
      bold:true, caps:true, charSpacing:TRACK, align:al, valign:'middle', lineSpacing:1,
      insets:{l:0.02,t:0,r:0.02,b:0} });
    if (p.note) els.push({ type:'t', text:p.note, x:dx, y:r.y + 0.16, w:dw, h:0.15, font:'B', size:NOTE_PT,

  });

    if (cfg.style === 'dots') els.push({ type:'o', x:0.66, y:ly + 0.035, w:0.1, h:0.1, fill:HI });
    else els.push({ type:'s', x:0.66, y:ly + 0.035, w:0.16, h:0.1, fill:HI });
    els.push({ type:'t', text:cfg.legend, x:0.88, y:ly, w:4, h:0.17, font:'B', size:8, color:SUB,
      caps:true, charSpacing:TRACK, valign:'middle', lineSpacing:1, insets:{l:0,t:0,r:0,b:0} });

}

// ============================================================
// LAYOUT: mapWorld -- decorative world map / globes (no data)

function layout_mapWorld(cfg) {

    font:'B', size:14.5, color:'accentDim', valign:'bottom', caps:true, lineSpacing:0.9,

  els.push({ type:'t', text:cfg.title || '', x:0.61, y:0.85, w:12.12, h:0.5,
    font:'H', size:24, color:'titleGray', caps:true, lineSpacing:1, charSpacing:2.64,
    insets:{l:0.035,t:0.035,r:0.035,b:0.035} });
  if (cfg.intro || cfg.text) els.push({ type:'t', text:cfg.intro || cfg.text, x:0.61, y:1.33, w:12.12, h:0.39,

    insets:{l:0.028,t:0.028,r:0.028,b:0.028} });

  if (cfg.style === 'globes') {
    var pick = (cfg.globes && cfg.globes.length ? cfg.globes : GLOBES).filter(function (g) {

      return ok;
    }).slice(0, 4);
    var caps = cfg.captions || [];
    var D = 2.45, gap = 0.55, total = pick.length * D + (pick.length - 1) * gap;
    var x0 = 0.61 + (12.12 - total) / 2, y0 = caps.length ? 2.55 : 2.85;
    pick.forEach(function (g, i) {
      var x = x0 + i * (D + gap);

      if (caps[i]) els.push({ type:'t', text:caps[i], x:x - 0.3, y:y0 + D + 0.2, w:D + 0.6, h:0.3, font:'B', size:9,
        color:INK, bold:true, caps:true, charSpacing:0.6, align:'center', valign:'top', lineSpacing:1,
        insets:{l:0,t:0,r:0,b:0} });
    });

  }

  var areaW = 12.12, areaH = 5.05, h = Math.min(areaH, areaW / W.aspect), w = h * W.aspect;
  els.push({ type:'img', src: A + 'maps/' + W.file + (W.variants ? shade : '') + '.png',
    x: 0.61 + (areaW - w) / 2, y: 1.95 + (areaH - h) / 2, w: w, h: h });
  return els;
}

DL.LAYOUT_MAP.mapUS = layout_mapUS;
DL.LAYOUT_MAP.mapWorld = layout_mapWorld;
DL.LAYOUT_KEYS.mapWorld = ['tag', 'title', 'intro', 'text', 'style', 'globes', 'captions'];
DL.LAYOUT_KEYS.mapUS = ['tag', 'title', 'intro', 'text', 'style', 'highlight', 'cities', 'legend', 'marker'];
DL.MAPS = { project: project, findState: findState, resolveCity: resolveCity };
})();

        });
      }
    }

    // STEP 6: Notes + Logo
    if (slideData.notes) slide.addNotes(slideData.notes);

    if (_customLogo && !_noLogo) {
      var logoSrc = isDark ? _customLogo.src : _customLogo.srcInverted;
      var lw = _customLogo.width / 144; var lh = lw * (_customLogo.aspectRatio || 0.5);
      var pos = _customLogo.position || 'bottom-right';
      var lx, ly;
      if (pos === 'bottom-right') { lx = 12.15 - lw - 0.15; ly = 7.05 + (0.25 - lh) / 2; }
      else if (pos === 'top-right') { lx = 13.33 - lw - 0.3; ly = 0.15; }
      else if (pos === 'top-left') { lx = 0.3; ly = 0.15; }
      else { lx = 0.3; ly = 7.05; }
      slide.addImage({ data: logoSrc, x: lx, y: ly, w: lw, h: lh });
    }
  });

  var title = (_config.title || 'Presentation').replace(/[^a-zA-Z0-9\s_-]/g, '').replace(/\s+/g, '_').substring(0, 40);
  var fileName = title + '_' + _D.length + 'slides.pptx';

  // PptxGenJS hardcodes kern="0" on every run, which switches PowerPoint's
  // kerning OFF. The MMW spec calls for kerning at 1pt and above (kern="100").
  // There is no API for it, so repack the .pptx and rewrite the attribute.
  // JSZip ships inside pptxgen.bundle.js, so this needs no extra dependency.
  // If it is unavailable for any reason, fall back to the unpatched download
  // rather than failing the export outright.
  var finish = function (msg) {
    if (downloadBtn) { downloadBtn.disabled = false; downloadBtn.textContent = '\u2B07 Download'; }
    showToast(msg, 'ok');
  };
  if (typeof JSZip === 'undefined') {
    console.warn('[SD] JSZip unavailable - exporting without the kerning fix.');
    pptx.writeFile({ fileName: fileName }).then(function () { finish('PPTX downloaded!'); })
      .catch(function (err) {
        if (downloadBtn) { downloadBtn.disabled = false; downloadBtn.textContent = '\u2B07 Download'; }
        showToast('Export failed: ' + err.message, 'bad'); console.error('[SD] Export error:', err);
      });
    return;
  }
  // Use arraybuffer, not blob, for BOTH hand-offs. JSZip only accepts a Blob
  // when its own feature detection reports a browser, so a blob round-trip
  // fails outright anywhere else and buys nothing here. ArrayBuffer is
  // understood universally, which also makes the exporter testable headlessly.
  pptx.write({ outputType: 'arraybuffer' }).then(function (ab) {
    return JSZip.loadAsync(ab);
  }).then(function (zip) {
    var jobs = [];
    zip.forEach(function (path, entry) {
      if (/^ppt\/slides\/slide\d+\.xml$/.test(path)) {
        jobs.push(entry.async('string').then(function (xml) {
          xml = xml.replace(/(<a:rPr\b[^>]*?)\skern="0"/g, '$1 kern="100"');
          xml = applyPhotoMasks(xml);

        }));
      } else if (/^ppt\/charts\/chart\d+\.xml$/.test(path)) {
        jobs.push(entry.async('string').then(function (xml) {
