  // (bronze/red/navy/green/plum/gold/teal/charcoal/copper/indigo/
  // slate/wine/sage) intentionally dropped; pull from standard-deck-v3
  // if a non-MMW family is ever genuinely needed here.
  // spark.mid is the TEMPLATE-CONFIRMED value (#C4A584, 19 occurrences in
  // MMW PPT Template_7.24.26.pptx). brand.json documents #C4A484, which
  // appears nowhere in the template. Pending a brand-owner ruling; revert
  // this one value if brand.json is declared canonical.
  spark:    { light: '#FFE0C0', mid: '#C4A584', dark: '#9C7C5C' },  // MMW main accent
  canopy:   { light: '#B3BCB5', mid: '#43644B', dark: '#203822' },  // MMW secondary, green
  aurora:   { light: '#AFAEC1', mid: '#585181', dark: '#2D273D' },  // MMW secondary, purple
  tide:     { light: '#7CACC1', mid: '#074169', dark: '#0B2A47' }   // MMW secondary, blue
};

// Read off the template's own 10 chart parts, ordered brand-forward. v1.0's
// values were transcribed by eye and every one was a near-miss: #C4A484 for
// #C4A485, #7CACC1 for #7CA8C1, #43644B for #4A634D, #B3BCB5 for #B3BDB6.
var CHART_SERIES = ['#BFA588', '#7CA8C1', '#4A634D', '#C4A485', '#808080'];
var CHART_SERIES_LIGHT = ['#C4A485', '#B3BDB6', '#416986', '#EEEEEE', '#999999'];

var _accentLight = '#FFE0C0';
var _accentMid   = '#C4A484';
var _accentDark  = '#9C7C5C';
var _familyName  = 'spark';

// H = display (theme majorFont, Mazda Type Bold). B = body (theme minorFont,
// Arial). v1.0 mapped BOTH to Mazda Type, so body copy previewed in the display
// face -- the template's body font is Arial, not Mazda Type.
var FONT_MAP = {
  H:  { face: '"Mazda Type Bold", "Mazda Type", Helvetica, Arial, sans-serif', weight: 500 },
  HR: { face: '"Mazda Type", Helvetica, Arial, sans-serif', weight: 400 },
  B:  { face: 'Arial, Helvetica, sans-serif', weight: 400 }
};

var LIMITS = {
  bullets: 5, tableRows: 8, tableCols: 5,
  cards: 4, stats: 6, paragraphs: 3, rows: 4,
  cardTitleChars: 30, statLabelChars: 25,
  coverTitleChars: 40, titleChars: 48
};

var MIN_SIZES = {
  coverTitle: 36, title: 33, cardTitle: 21,
  subtitle: 18, body: 15, table: 12,
  statValue: 42, tag: 10, footnote: 6   // 6, not 7: MMW grid captions are 6.5pt
};

// ============================================================
// TYPOGRAPHY
// ============================================================

var TEXT_STYLES = {
  L1: { transform: 'uppercase', spacing: '0.25em', weight: 500 },
  L2: { transform: 'uppercase', spacing: '0.05em', weight: 500 },
  L3: { transform: 'uppercase', spacing: '0.08em', weight: 500 },
  L4: { transform: 'none',      spacing: 'normal', weight: 400 },
  L5: { transform: 'uppercase', spacing: '0.10em', weight: 400 }
};

var _currentSlideLayout = null;

function getTextStyle(el) {
  if (el.textStyle && TEXT_STYLES[el.textStyle]) return el.textStyle;
  if ((_currentSlideLayout === 'cover' || _currentSlideLayout === 'closing') && el.size >= 36) return 'L1';
  if ((_currentSlideLayout === 'divider' || _currentSlideLayout === 'coverloc') && el.size >= 36) return 'L4';
  if (el.size >= 30 && el.font === 'H' && !el.textStyle) return 'L2';
  if (el.color === 'accent' && el.size <= 14 && el.font === 'H') return 'L3';
  if (el.size >= 18 && el.size <= 24 && el.font === 'H') return 'L3';
  if (el.size <= 10 || el.color === 'muted') return 'L5';
  return 'L4';
}

// ============================================================
// DATE GENERATION
// ============================================================

var MONTHS = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];

function getFooterDate() {
  var now = new Date();
  return MONTHS[now.getMonth()] + ' ' + now.getFullYear();
}

// ============================================================
// COLOR RESOLUTION
// ============================================================

function resolveColor(token, isDark) {
  if (!token || typeof token !== 'string') return isDark ? PALETTE.white : PALETTE.black;
  if (token.charAt(0) === '#') return token;
  var semantics = {
    title: isDark ? PALETTE.white : PALETTE.black,
    body: isDark ? PALETTE.ltGray : PALETTE.mdGray,
    sub: isDark ? _accentLight : PALETTE.mdGray,
    muted: PALETTE.gray,
    accent: _accentMid, accentLt: _accentLight, accentDk: _accentDark,
    cardBg: isDark ? PALETTE.dkGray : '#FFFFFF',
    cardBorder: isDark ? 'transparent' : PALETTE.ltGray,
    slideBg: isDark ? PALETTE.black : PALETTE.white,
    white: '#FFFFFF', black: '#000000',
    deepBlack: PALETTE.deepBlack
  };
  if (semantics[token]) return semantics[token];
  if (PALETTE[token]) return PALETTE[token];
  return isDark ? PALETTE.white : PALETTE.black;
}

function colorForPptx(token, isDark) {
  return resolveColor(token, isDark).replace('#', '');
}

// ============================================================
// BACKGROUND MODE — removed, no-ops for compat
// ============================================================

function setBgMode() {}
function getBgMode() { return 'standard'; }
function detectBgMode() { return 'standard'; }

// ============================================================
// COORDINATE CONVERSION
// ============================================================

function toX(inches) { return Math.round(inches * SX); }
function toY(inches) { return Math.round(inches * SY); }
function ptToPx(pt)  { return Math.round(pt * PT_PX); }

// ============================================================
// TITLE HEIGHT DETECTION
// ============================================================

function getTitleMetrics(title) {
  var len = (title || '').length;
  if (len > SD_CONST.TITLE_WRAP_THRESHOLD) {
    return { titleH: SD_CONST.TITLE_H_2, contentY: SD_CONST.CONTENT_Y_2 };
  }
  return { titleH: SD_CONST.TITLE_H_1, contentY: SD_CONST.CONTENT_Y };
}

// ============================================================
// SAFE AREA VALIDATION
// ============================================================

function validatePosition(el, slideIndex) {
  if (!el || typeof el.x === 'undefined' || typeof el.y === 'undefined') return;
  var C = SD_CONST;
  var right = el.x + (el.w || 0);
  var bottom = el.y + (el.h || 0);
  if (el.type === 't' && el.y < C.CONTENT_Y) {
    if (el.y >= C.TAG_Y && el.y <= C.TITLE_Y + C.TITLE_H_2) return;
  }
  if (el.y < C.CONTENT_Y && el.type !== 't') {
    console.warn('[SD] Slide ' + slideIndex + ': Element at y:' + el.y + ' above CONTENT_Y');
  }
  if (bottom > C.CONTENT_END) {
    console.warn('[SD] Slide ' + slideIndex + ': Element bottom y:' + bottom.toFixed(2) + ' exceeds CONTENT_END');
  }
  if (right > C.SAFE_X_MAX) {
    console.warn('[SD] Slide ' + slideIndex + ': Element right x:' + right.toFixed(2) + ' exceeds SAFE_X_MAX');
  }
}

// ============================================================
// SLIDE & ELEMENT VALIDATION
// ============================================================

function validateSlide(slide, index) {
  var warn = function (msg) { console.warn('[standard-deck] Slide ' + index + ': ' + msg); };
  if (slide.layout && slide.els) { warn('has both layout and els -- layout takes precedence'); delete slide.els; }
  var maxTitle = (slide.layout === 'cover' || slide.layout === 'closing') ? LIMITS.coverTitleChars : LIMITS.titleChars;
  if (slide.title && slide.title.length > maxTitle) {
    warn('title exceeds ' + maxTitle + ' chars -- truncating');
    slide.title = slide.title.substring(0, maxTitle - 3) + '...';
  }
  if (slide.els) { slide.els = slide.els.map(function (el) { return validateElement(el, slide, index); }); }
  return slide;
}

// A negative width or height is invalid in the exported XML -- PowerPoint
// rejects the file outright and offers to repair it, with no clue which shape
// caused it. Catch it at dispatch, where the layout name is still known.
function assertNonNegative(el, layout) {
  if ((el.w != null && el.w < 0) || (el.h != null && el.h < 0)) {
    if (el.type !== 'ln') {
      console.error('[standard-deck] "' + layout + '" produced a negative size (' +
        el.type + ' w=' + el.w + ' h=' + el.h + '). PowerPoint will refuse the file.');
      el.w = Math.abs(el.w || 0); el.h = Math.abs(el.h || 0);
    }
  }
  return el;
}

function validateElement(el, slide, slideIndex) {
  if (el.type === 't' && typeof el.size === 'number' && el.size < MIN_SIZES.footnote) el.size = MIN_SIZES.footnote;
  // Full-bleed is a real MMW design device: ~41% of the template's content
  // slides intentionally cross the safe area, and several photo wells sit at
  // negative coordinates. Clamping silently destroyed those compositions, so
  // it is now opt-in per element via _clampToSafe:true.
  if (el._clampToSafe) {
    if (typeof el.x === 'number' && el.x < SD_CONST.SAFE_X_MIN) el.x = SD_CONST.SAFE_X_MIN;
    if (typeof el.y === 'number' && el.y < SD_CONST.SAFE_Y_MIN) el.y = SD_CONST.SAFE_Y_MIN;
  }
  if (el.type === 't' && el._parentShape) {
    var maxW = el._parentShape.w * SD_CONST.TEXT_RATIO;
    if (el.w > maxW) { el.x = el._parentShape.x + (el._parentShape.w - maxW) / 2; el.w = maxW; }
  }
  return el;
}

function enforceWidthRule(els) {
  // Photo wells are emitted as type:'s' with _imgPlaceholder. They are picture
  // frames, not text containers -- a caption that happens to sit over one must
  // not be re-flowed to 80% of it. Excluded here.
  var shapes = els.filter(function (e) {
    return (e.type === 's' || e.type === 'o') && !e._imgPlaceholder;
  });
  els.forEach(function (el) {
    if (el.type !== 't' || el._noWidthRule) return;
    for (var i = 0; i < shapes.length; i++) {
      var s = shapes[i];
      if (el.x >= s.x && el.y >= s.y && el.x + el.w <= s.x + s.w + 0.01 && el.y + el.h <= s.y + s.h + 0.01) {
        var maxW = s.w * SD_CONST.TEXT_RATIO;
        if (el.w > maxW) { el.x = s.x + (s.w - maxW) / 2; el.w = maxW; }
        break;
      }
    }
  });
  return els;
}

// ============================================================
// ELEMENT RENDERERS
// ============================================================

function renderElement(el, isDark) {
  var renderers = { t: renderText, s: renderShape, o: renderOval, i: renderIcon, d: renderDivider, p: renderPill, b: renderBar, ln: renderLine, path: renderPath, chart: renderChart, tbl: renderTable, img: renderImage };
  var fn = renderers[el.type];
  if (!fn) { console.warn('[standard-deck] Unknown element type: ' + el.type); return document.createElement('div'); }
  return fn(el, isDark);
}

function renderText(el, isDark) {
  var div = document.createElement('div');
  div.setAttribute('contenteditable', 'true');
  div.setAttribute('spellcheck', 'false');
  var isTitle = (el.size >= 30);
  div.style.cssText = 'position:absolute;box-sizing:border-box;word-wrap:break-word;overflow:' + (isTitle ? 'visible' : 'hidden') + ';';
  div.style.left = toX(el.x) + 'px';
  div.style.top = toY(el.y) + 'px';
  div.style.width = toX(el.w) + 'px';
  div.style.height = toY(el.h) + 'px';
  if (el.rotation) {
    div.style.transform = 'rotate(' + el.rotation + 'deg)';
    div.style.transformOrigin = 'center';
  }
  // Text insets (PowerPoint bodyPr lIns/tIns/rIns/bIns). x/y/w/h describe the
  // FRAME; text starts inset from it. 370 of the template's 392 text elements
  // carry non-zero insets -- mostly 0.079/0.104in -- so ignoring them shifted
  // every text block up to 0.1in left and high of the source.
  if (el.insets) {
    div.style.padding = toY(el.insets.t || 0) + 'px ' + toX(el.insets.r || 0) + 'px ' +
                        toY(el.insets.b || 0) + 'px ' + toX(el.insets.l || 0) + 'px';
  }
  div.style.fontSize = ptToPx(el.size) + 'px';
  div.style.color = resolveColor(el.color || 'body', isDark);
  div.style.lineHeight = '1.35';
  var fm = FONT_MAP[el.font] || FONT_MAP['B'];
  div.style.fontFamily = fm.face;
  div.style.fontWeight = fm.weight;
  if (el.bold) div.style.fontWeight = 700;
  if (el.italic) div.style.fontStyle = 'italic';
  if (el.underline) div.style.textDecoration = 'underline';
  var isCompact = el.w <= 0.80 && el.h <= 0.80;
  div.style.textAlign = el.align || (isCompact ? 'center' : 'left');
  // EXPLICIT TYPOGRAPHY (v2.0). MMW layout elements always carry `caps`, which
  // marks the element as fully specified: casing, tracking and line-height come
  // from the template, not from getTextStyle()'s size/colour guesswork. That
  // heuristic uppercases anything <=10pt or coloured 'muted' -- which would have
  // wrongly capitalised 161 of the template's body/caption elements -- and
  // hardcodes 1.35 line-height where the template is mostly 1.0.
  // Elements WITHOUT `caps` (legacy raw compositions) keep the old behaviour.
  if (el.caps !== undefined) {
    div.style.textTransform = el.caps ? 'uppercase' : 'none';
    // charSpacing is in POINTS (PowerPoint's "Expanded by N pt"), so convert to
    // preview pixels. An earlier build emitted this as 'em', which at the
    // template's 6.97pt eyebrow tracking would have been ~7 character widths.
    div.style.letterSpacing = (el.charSpacing != null && el.charSpacing !== 0)
      ? (el.charSpacing * PT_PX).toFixed(2) + 'px' : 'normal';
    div.style.lineHeight = String(el.lineSpacing != null ? el.lineSpacing : 1.0);
    // Kerning on for all sizes down to 1pt, matching the template's setting.
    div.style.fontKerning = 'normal';
  } else {
    var textStyle = getTextStyle(el);
    var ts = TEXT_STYLES[textStyle];
    div.style.textTransform = ts.transform;
    div.style.letterSpacing = ts.spacing;
    if (textStyle === 'L1') div.style.fontWeight = 500;
  }
  if (el.valign === 'middle' || el.valign === 'bottom') {
    div.style.display = 'flex'; div.style.flexDirection = 'column';
    div.style.justifyContent = el.valign === 'middle' ? 'center' : 'flex-end';
    if (isCompact || el.align === 'center') div.style.alignItems = 'center';
  }
  // ---- RICH PARAGRAPHS ------------------------------------------------
  // Some template text boxes are not a flat string: the Table of Contents
  // heading is a grey subtitle and a black title separated by <a:br/> inside one
  // paragraph, and its list mixes a grey number run with a black topic run per
  // line, plus indented sub-bullets at a smaller size. `paras` models that:
  //   paras:[{ runs:[{text,color,size,bold}], size, marL, indent,
  //            bullet, bulletSizePct, breakBefore }]
  // Elements without `paras` keep the old flat-string behaviour untouched.
  if (el.paras && el.paras.length) {
    el.paras.forEach(function (p) {
      var pdiv = document.createElement('div');
      if (p.size) pdiv.style.fontSize = ptToPx(p.size) + 'px';
      if (p.bullet) {
        // Flexbox hanging indent, not margin-left + negative text-indent.
        // The negative-indent technique clips the bullet glyph under Chrome
        // whenever the text element also has overflow:hidden (every non-title
        // element does) -- the glyph was present in the DOM but invisible.
        // A flex row with a fixed-width bullet column sidesteps the clip
        // entirely and wraps continuation lines under the text, not the bullet.
        pdiv.style.display = 'flex';
        pdiv.style.alignItems = 'flex-start';
        var bw = toX(Math.abs(p.indent || p.marL || 0.125));
        var b = document.createElement('span');
        b.textContent = (p.bulletChar || '\u2022');
        b.style.flex = '0 0 ' + bw + 'px';
        if (p.bulletSizePct) b.style.fontSize = (p.bulletSizePct / 100) + 'em';
        pdiv.appendChild(b);
        var textWrap = document.createElement('div');
        textWrap.style.flex = '1';
        textWrap.style.minWidth = '0';
        (p.runs || []).forEach(function (r) {
          var sp = document.createElement('span');
          sp.textContent = r.text || '';
          if (r.color) sp.style.color = resolveColor(r.color, isDark);
          if (r.size) sp.style.fontSize = ptToPx(r.size) + 'px';
          if (r.bold !== undefined) sp.style.fontWeight = r.bold ? 700 : 400;
          textWrap.appendChild(sp);
        });
        pdiv.appendChild(textWrap);
        div.appendChild(pdiv);
        return;
      }
      if (p.marL) pdiv.style.marginLeft = toX(p.marL) + 'px';
      if (p.indent) pdiv.style.textIndent = toX(p.indent) + 'px';
      (p.runs || []).forEach(function (r) {
        var sp = document.createElement('span');
        sp.textContent = r.text || '';
        if (r.color) sp.style.color = resolveColor(r.color, isDark);
        if (r.size) sp.style.fontSize = ptToPx(r.size) + 'px';
        if (r.bold !== undefined) sp.style.fontWeight = r.bold ? 700 : 400;
        pdiv.appendChild(sp);
      });
      div.appendChild(pdiv);
    });
    return div;
  }

  if (el.text && el.text.indexOf('\n') > -1) {
    el.text.split('\n').forEach(function (line, i) {
      if (i > 0) div.appendChild(document.createElement('br'));
      div.appendChild(document.createTextNode(line));
    });
  } else {
    var span = document.createElement('span');
    span.textContent = el.text || '';
    div.appendChild(span);
  }
  return div;
}

function renderShape(el, isDark) {
  var div = document.createElement('div');
  div.style.cssText = 'position:absolute;';
  div.style.left = toX(el.x) + 'px'; div.style.top = toY(el.y) + 'px';
  div.style.width = toX(el.w) + 'px'; div.style.height = toY(el.h) + 'px';
  // [v6.0.6] CSS gradient support for imageCards
  if (el._cssGradient) {
    div.style.background = el._cssGradient;
  } else if (el.fill === 'none') {
    // Outline-only box. The matrix on source slide 89 is built entirely from
    // these, so an unfilled shape has to stay unfilled rather than falling
    // back to cardBg and hiding everything behind it.
    div.style.backgroundColor = 'transparent';
  } else {
    div.style.backgroundColor = resolveColor(el.fill || 'cardBg', isDark);
  }
  if (el.border && typeof el.border === 'string') div.style.border = '1px solid ' + resolveColor(el.border, isDark);
  // Corner radius in INCHES. radius:'pill' rounds the short axis fully, which is
  // what the template's roundRect bars do (adj=50000).
  if (el.radius != null) {
    var r = (el.radius === 'pill') ? Math.min(el.w, el.h) / 2 : el.radius;
    div.style.borderRadius = toX(r) + 'px';
  }
  if (el.transparency) div.style.opacity = (100 - el.transparency) / 100;
  // Gradient fill: { from, to, angle } with angle in degrees clockwise from
  // 12 o'clock, matching DrawingML's <a:lin ang>. The template's spend-bar
  // value circles use this.
  if (el.gradient) {
    var gA = (el.gradient.angle == null) ? 45 : el.gradient.angle;
    div.style.background = 'linear-gradient(' + gA + 'deg,' +
      resolveColor(el.gradient.from, isDark) + ',' +
      resolveColor(el.gradient.to, isDark) + ')';
  }
  // Outline in points, distinct from the 1px `border` shorthand. `dash` takes
  // 'dash' or 'dot' -- the template draws its spoke rings dashed and its
  // descriptive boxes dotted, both via <a:custDash> rather than a preset.
  if (el.stroke) {
    var st = (el.dash === 'dot') ? 'dotted' : (el.dash === 'dash' ? 'dashed' : 'solid');
    div.style.border = ptToPx(el.strokeWidth || 1) + 'px ' + st + ' ' +
      resolveColor(el.stroke, isDark);
  }
  // Outer drop shadow. Angle is degrees clockwise from east, matching
  // DrawingML's <a:outerShdw dir>.
  if (el.shadow) {
    var sh = (el.shadow === true) ? {} : el.shadow;
    var ang = (sh.angle == null ? 172 : sh.angle) * Math.PI / 180;
    var dist = toX(sh.offset == null ? 0.167 : sh.offset);
    div.style.boxShadow = (Math.cos(ang) * dist).toFixed(1) + 'px ' +
      (Math.sin(ang) * dist).toFixed(1) + 'px ' +
      toX(sh.blur == null ? 0.104 : sh.blur).toFixed(1) + 'px rgba(0,0,0,' +
      (sh.opacity == null ? 0.05 : sh.opacity) + ')';
  }
  // Custom geometry: el.points are fractions of the shape box, so clip-path in
  // percent reproduces the outline at any scale. Without this the shape renders
  // as its bounding rectangle -- on the divider layouts that is a solid block
  // across half the slide instead of the angular MMW mark.
  if (el.points && el.points.length > 2) {
    div.style.clipPath = 'polygon(' + el.points.map(function (p) {
      return (p[0] * 100).toFixed(3) + '% ' + (p[1] * 100).toFixed(3) + '%';
    }).join(',') + ')';
  }
  return div;
}

function renderLine(el, isDark) {
  // A connector, not a filled rule: it can carry arrowheads, which the template
  // uses on every milestone line (headEnd + tailEnd, both triangles).
  var div = document.createElement('div');
  div.style.cssText = 'position:absolute;overflow:visible;';
  var pad = 8;
  // Negative w/h means the line runs up or left. Normalise the box and draw the
  // segment corner-to-corner, so direction is preserved without a negative size.
  var dw = el.w || 0, dh = el.h || 0;
  var x0 = el.x + Math.min(0, dw), y0 = el.y + Math.min(0, dh);
  div.style.left = (toX(x0) - pad) + 'px'; div.style.top = (toY(y0) - pad) + 'px';
  var w = Math.abs(toX(dw)), h = Math.abs(toY(dh));
  div.style.width = (w + pad * 2) + 'px'; div.style.height = (h + pad * 2) + 'px';
  var fx = dw < 0, fy = dh < 0;
  var col = resolveColor(el.color || 'ltGray', isDark);
  var wt = ptToPx(el.weight || 1.5);
  var id = 'ah' + Math.random().toString(36).slice(2, 8);
  var isDot = el.markerStyle === 'dot';
  var a1 = (el.arrows === 'both' || el.arrows === 'start') ? ' marker-start="url(#' + id + ')"' : '';
  var a2 = (el.arrows === 'both' || el.arrows === 'end') ? ' marker-end="url(#' + id + ')"' : '';
  var markerShape = isDot
    ? '<circle cx="5" cy="5" r="4" fill="' + col + '"/>'
    : '<path d="M 0 0 L 10 5 L 0 10 z" fill="' + col + '"/>';
  var markerSize = isDot ? 3 : 4;
  div.innerHTML =
    '<svg width="100%" height="100%" style="overflow:visible">' +
    '<defs><marker id="' + id + '" viewBox="0 0 10 10" refX="5" refY="5" ' +
    'markerWidth="' + markerSize + '" markerHeight="' + markerSize + '" orient="auto-start-reverse">' +
    markerShape + '</marker></defs>' +
    '<line x1="' + (pad + (fx ? w : 0)) + '" y1="' + (pad + (fy ? h : 0)) + '" ' +
    'x2="' + (pad + (fx ? 0 : w)) + '" y2="' + (pad + (fy ? 0 : h)) + '" ' +
    'stroke="' + col + '" stroke-width="' + wt + '" stroke-linecap="square"' + a1 + a2 + '/></svg>';
  return div;
}

function renderOval(el, isDark) { var div = renderShape(el, isDark); div.style.borderRadius = '50%'; return div; }

// Curved connector: el.path is a list of segments, each either
// {cmd:'M'|'L', x, y} or {cmd:'C', x1, y1, x2, y2, x, y} -- all coordinates
// are fractions (0-1) of el.x/y/w/h, the same convention renderShape's

function renderBar(el, isDark) {

// ============================================================
// CHART RENDERERS
// ============================================================

function renderChart(el, isDark) {
  var container = document.createElement('div');
  // Transparent, no border -- matches the template, whose charts are <a:noFill/>
  // so the slide ground shows through. A card background here would disagree
  // with the exported PPTX and paint a bright slab on the gray canvas.
  container.style.cssText = 'position:absolute;overflow:hidden;';
  container.style.left = toX(el.x) + 'px'; container.style.top = toY(el.y) + 'px';
  container.style.width = toX(el.w) + 'px'; container.style.height = toY(el.h) + 'px';
  var cw = toX(el.w); var ch = toY(el.h);
  var canvas = document.createElement('canvas'); canvas.width = cw; canvas.height = ch; container.appendChild(canvas);
  var ctx = canvas.getContext('2d');
  var data = el.data || []; var opts = el.opts || {};
  if (opts.showTitle && opts.title) {
    ctx.font = '500 ' + ptToPx(12) + 'px Mazda Type, Arial, sans-serif';
    ctx.fillStyle = resolveColor('title', isDark); ctx.fillText(opts.title, 20, ptToPx(14) + 10);
  }
  var chartType = el.chartType || 'bar';
  if (chartType === 'bar') renderBarChart(ctx, data, opts, cw, ch, isDark);
  else if (chartType === 'line' || chartType === 'area') renderLineChart(ctx, data, opts, cw, ch, isDark, chartType === 'area');
  else if (chartType === 'pie' || chartType === 'doughnut') renderPieChart(ctx, data, opts, cw, ch, isDark, chartType === 'doughnut');
  return container;
}

function renderBarChart(ctx, data, opts, cw, ch, isDark) {
  if (!data.length || !data[0].values) return;
  var series = data; var labels = series[0].labels || [];
  var nGroups = labels.length; var nSeries = series.length; var maxVal = 0;
  series.forEach(function (s) { s.values.forEach(function (v) { if (v > maxVal) maxVal = v; }); });
  if (maxVal === 0) maxVal = 1;
  var padding = { top: 60, right: 40, bottom: 50, left: 60 };
  var plotW = cw - padding.left - padding.right; var plotH = ch - padding.top - padding.bottom;
  var groupW = plotW / nGroups; var barW = (groupW * 0.7) / nSeries; var gap = groupW * 0.3;
  var colors = resolveChartColors(opts.chartColors || null, nSeries, isDark);
  series.forEach(function (s, si) {
    s.values.forEach(function (val, vi) {
      var bx = padding.left + vi * groupW + gap / 2 + si * barW;
      var bh = (val / maxVal) * plotH; var by = padding.top + plotH - bh;
      // Square corners -- confirmed against source: vertical (column) bars
      // do not get rounded ends in this deck. Only horizontal bars do (see
      // reportSplitPanels / reportSpendBars(Light/Dark), radius:'pill').
      ctx.fillStyle = colors[si]; ctx.fillRect(bx, by, barW - 2, bh);
      if (opts.showValue) {
        ctx.font = '500 ' + ptToPx(8) + 'px Mazda Type, Arial, sans-serif';
        ctx.fillStyle = resolveColor('title', isDark); ctx.textAlign = 'center';
        ctx.fillText(formatVal(val), bx + barW / 2, by - 6);
      }
    });
  });
  ctx.font = ptToPx(8) + 'px Mazda Type, Arial, sans-serif';
  ctx.fillStyle = resolveColor('muted', isDark); ctx.textAlign = 'center';
  labels.forEach(function (lbl, i) { ctx.fillText(lbl, padding.left + i * groupW + groupW / 2, ch - padding.bottom + 20); });
}

function renderLineChart(ctx, data, opts, cw, ch, isDark, isArea) {
  if (!data.length || !data[0].values) return;
  var series = data; var labels = series[0].labels || [];
  var nPoints = labels.length; var maxVal = 0;
  series.forEach(function (s) { s.values.forEach(function (v) { if (v > maxVal) maxVal = v; }); });
  if (maxVal === 0) maxVal = 1;
  var padding = { top: 60, right: 40, bottom: 50, left: 60 };
  var plotW = cw - padding.left - padding.right; var plotH = ch - padding.top - padding.bottom;
  var colors = resolveChartColors(opts.chartColors || null, series.length, isDark);
  series.forEach(function (s, si) {
    ctx.beginPath(); ctx.strokeStyle = colors[si]; ctx.lineWidth = 3;
    s.values.forEach(function (val, vi) {
      var px = padding.left + (vi / (nPoints - 1 || 1)) * plotW;
      var py = padding.top + plotH - (val / maxVal) * plotH;
      if (vi === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    });
    if (isArea) {
      ctx.lineTo(padding.left + plotW, padding.top + plotH);
      ctx.lineTo(padding.left, padding.top + plotH); ctx.closePath();
      ctx.globalAlpha = 0.15; ctx.fillStyle = colors[si]; ctx.fill(); ctx.globalAlpha = 1.0;
    }

      ctx.beginPath(); ctx.arc(px, py, 5, 0, Math.PI * 2); ctx.fillStyle = colors[si]; ctx.fill();
    });

  ctx.fillStyle = resolveColor('muted', isDark); ctx.textAlign = 'center';
  labels.forEach(function (lbl, i) { ctx.fillText(lbl, padding.left + (i / (nPoints - 1 || 1)) * plotW, ch - padding.bottom + 20); });
}

function renderPieChart(ctx, data, opts, cw, ch, isDark, isDoughnut) {
  if (!data.length || !data[0].values) return;

  var hole = isDoughnut ? radius * ((opts.holeSize || 70) / 100) : 0;
  var colors = resolveChartColors(opts.chartColors || null, values.length, isDark);

    var sliceAngle = (val / total) * Math.PI * 2; var endAngle = startAngle + sliceAngle;

    if (isDoughnut) ctx.arc(cx, cy, hole, endAngle, startAngle, true); else ctx.lineTo(cx, cy);

      var lx = cx + Math.cos(midAngle) * labelR; var ly = cy + Math.sin(midAngle) * labelR;

      ctx.fillStyle = '#FFFFFF'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

function resolveChartColors(tokens, count, isDark) {
  var colors = [];
  for (var i = 0; i < count; i++) {
    if (tokens && tokens[i % tokens.length]) colors.push(resolveColor(tokens[i % tokens.length], isDark));
    else colors.push(CHART_SERIES[i % CHART_SERIES.length]);

  return colors;
}

function formatVal(v) {
  if (v >= 1000000) return (v / 1000000).toFixed(1) + 'M';
  if (v >= 1000) return (v / 1000).toFixed(1) + 'K';
  if (v % 1 !== 0) return v.toFixed(1);
  return v.toString();
}

function renderTable(el, isDark) {

  container.style.left = toX(el.x) + 'px'; container.style.top = toY(el.y) + 'px';
  container.style.width = toX(el.w) + 'px'; container.style.height = toY(el.h) + 'px';
  var table = document.createElement('table');
  table.style.cssText = 'width:100%;border-collapse:collapse;font-family:Mazda Type,Arial,sans-serif;font-size:' + ptToPx(10) + 'px;';

// ============================================================
// IMAGE RENDERER
// ============================================================

// Resolve an image element to its source URL. Brand marks are referenced by id
// (gi0/gi0w/gi1/gi1w); the artifact declares them as hidden <img id="..."> tags.
// getAttribute('src') -- not .src -- so the value matches the key used by the
// prefetch cache, which stores the path exactly as authored.
function resolveImgSrc(el) {
  if (!el) return null;
  if (el.src) return el.src;
  if (!el.ref) return null;
  var host = document.getElementById(el.ref);
  if (!host) return null;
  if (host.tagName === 'IMG') return host.getAttribute('src') || host.src || null;
  var inner = host.querySelector('img');
  return inner ? (inner.getAttribute('src') || inner.src || null) : null;
}

function renderImage(el) {
  var div = document.createElement('div');
  div.style.cssText = 'position:absolute;overflow:hidden;';
  div.style.left = toX(el.x) + 'px'; div.style.top = toY(el.y) + 'px';
  div.style.width = toX(el.w) + 'px'; div.style.height = toY(el.h) + 'px';
  // Do NOT mirror el.ref onto this div. The artifact's hidden <img> already owns
  // that id, and a duplicate makes getElementById() ambiguous for the exporter.
  if (el.ref) div.setAttribute('data-ref', el.ref);
  // A masked well clips the photo to a custom outline (Cover Photo2 cuts its
  // image into the angular MMW motif). Points are fractions of the frame, so
  // percentages reproduce it at any size.
  if (el.mask && el.mask.length > 2) {
    div.style.clipPath = 'polygon(' + el.mask.map(function (p) {
      return (p[0] * 100).toFixed(3) + '% ' + (p[1] * 100).toFixed(3) + '%';
    }).join(',') + ')';
  }
  var src = resolveImgSrc(el);
  if (src) {
    var img = document.createElement('img');
    img.src = src;
    // Cropped source (srcRect): scale the image up so the kept region fills the
    // frame, then offset it. 44% of the template's pictures are cropped, and
    // without this they show the wrong part of the artwork.
    if (el.crop) {
      var cl = el.crop.l || 0, ct = el.crop.t || 0,
          cr = el.crop.r || 0, cb = el.crop.b || 0;
      var kw = Math.max(1 - cl - cr, 0.001), kh = Math.max(1 - ct - cb, 0.001);
      img.style.cssText = 'position:absolute;width:' + (100 / kw) + '%;height:' +
        (100 / kh) + '%;left:' + (-cl * 100 / kw) + '%;top:' + (-ct * 100 / kh) +
        '%;object-fit:fill;';
    } else {
      // Brand marks must letterbox (contain) so they are never distorted.
      // Photography supplied into a photo well should fill it (cover), matching
      // how the template crops its own images into these frames.
      img.style.cssText = 'width:100%;height:100%;object-fit:' + (el.fit || 'contain') + ';';
    }
    if (typeof el.transparency === 'number') img.style.opacity = (100 - el.transparency) / 100;
    div.style.position = 'absolute';
    div.appendChild(img);
  } else {
    div.style.background = '#E8E8E8';
    if (el.ref) console.warn('[standard-deck] image ref "' + el.ref +
      '" not found. Add <img id="' + el.ref + '" src="..."> to the artifact.');
  }
  return div;
}

// ============================================================
// STRUCTURAL SLIDE DETECTION
// ============================================================

var STRUCTURAL_LAYOUTS = ['cover', 'closing', 'divider', 'coverloc'];

// Layouts that carry no footer in the source. The LAYOUT decides this, not the
// caller: reportStatRow fills the full canvas edge to edge, and a footer would
// collide with its bottom row.
var NO_FOOTER_LAYOUTS = ['reportStatRow', 'reportStatRowLight'];

function isStructuralSlide(layout) {
  return STRUCTURAL_LAYOUTS.indexOf(layout) > -1;
}

function suppressesFooter(layout) {
  return NO_FOOTER_LAYOUTS.indexOf(layout) > -1;
}

// ============================================================
// SLIDE RENDERING
// ============================================================

function renderSlide(slideData, index) {
  var isDark = !!slideData.dark;
  var slide = document.createElement('div');
  slide.className = 'slide' + (index === 0 ? ' active' : '');
  slide.style.cssText = 'position:absolute;top:0;left:0;width:1920px;height:1200px;overflow:hidden;background:' + resolveColor('slideBg', isDark) + ';';

  _currentSlideLayout = slideData.layout || null;
  var els;
  if (slideData.layout) {
    if (!window.DeckLayouts) {
      // Every layout-driven slide renders empty when deck-layouts.js is absent
      // or bailed at its load guard. Silently that looks like 67 blank slides
      // with only a footer, which is very hard to diagnose -- so say it.
      console.error('[standard-deck] window.DeckLayouts is undefined. ' +
        'deck-layouts.js did not load (404?) or bailed because standard-deck.js ' +
        'was not loaded first. Script order must be: standard-deck.js, ' +
        'deck-layouts.js, deck-shell.js.');
      els = [
        { type:'s', x:0.5, y:2.6, w:12.33, h:2.0, fill:'#FFF4F4' },
        { type:'t', text:'deck-layouts.js did not load', x:0.9, y:2.9, w:11.5, h:0.5,
          font:'B', size:18, bold:true, color:'#C12638', caps:false, lineSpacing:1 },
        { type:'t', text:'Check the browser console and the script order in this file.',
          x:0.9, y:3.5, w:11.5, h:0.6, font:'B', size:12, color:'#262626',
          caps:false, lineSpacing:1.2 }
      ];
    } else {
      els = window.DeckLayouts.dispatch(slideData);
    }
  } else {
    els = slideData.els || [];
  }

  if (slideData.bgColor) {
    slide.style.background = slideData.bgColor;
  }
  if (slideData.bgImage) {
    var _cache = (window.StandardShell && window.StandardShell._imageCache) || {};
    var _bgSrc = _cache[slideData.bgImage] || slideData.bgImage;
    slide.style.backgroundImage = 'url(' + _bgSrc + ')';
    slide.style.backgroundSize = 'cover';
    slide.style.backgroundPosition = 'center';
  }
  if (slideData.bgGradient) {
    slide.style.background = slideData.bgGradient;
  }

  els = enforceWidthRule(els);
  els.forEach(function (el) {
    validatePosition(el, index);
    slide.appendChild(renderElement(el, isDark));
  });

  // FOOTER: 3-way logic
  if (slideData.customFooter) {
    // Layout handles its own footer
  } else if (isStructuralSlide(slideData.layout)) {
    var mutedColor = resolveColor('muted', isDark);
    var dateDiv = document.createElement('div');
    dateDiv.style.cssText = 'position:absolute;bottom:24px;left:40px;'
      + 'font-size:' + ptToPx(7) + 'px;'
      + 'font-weight:400;'
      + 'letter-spacing:0.15em;'
      + 'text-transform:uppercase;'
      + 'color:' + mutedColor + ';'
      + 'font-family:Mazda Type,Arial,sans-serif;';
    dateDiv.textContent = _footerText || getFooterDate();
    slide.appendChild(dateDiv);
  } else if (_contentFooter) {
    var cfColor = '#767676';
    var cfDiv = document.createElement('div');
    cfDiv.style.cssText = 'position:absolute;bottom:24px;left:40px;'
      + 'font-size:' + ptToPx(7) + 'px;'
      + 'font-weight:400;'
      + 'letter-spacing:0.15em;'
      + 'text-transform:uppercase;'
      + 'color:' + cfColor + ';'
      + 'font-family:Mazda Type,Arial,sans-serif;';
    cfDiv.textContent = _contentFooter;
    slide.appendChild(cfDiv);

    if (slideData.num) {
      var numDiv = document.createElement('div');
      numDiv.style.cssText = 'position:absolute;bottom:24px;right:40px;'
        + 'font-size:' + ptToPx(7) + 'px;'
        + 'font-weight:400;'
        + 'color:' + cfColor + ';'
        + 'font-family:Mazda Type,Arial,sans-serif;';
      numDiv.textContent = slideData.num;
      slide.appendChild(numDiv);
    }
  }

  return slide;
}

function renderAll(D, container) {
  container.innerHTML = '';
  D.forEach(function (slideData, i) {
    container.appendChild(renderSlide(validateSlide(slideData, i), i));
  });
}

// ============================================================
// ACCENT / COLOR MANAGEMENT

// ==========================================================
// LAYOUT: REPORT PLATFORM MATRIX (SLIDE 91)  ->  cfg.layout = "reportPlatformMatrix"
// Template: "Report Platform Matrix (slide 91)"
// Source slide: 91   Background: solid #EFF0F3
// Set slideData.bgColor = "#EFF0F3".
// HAND-AUTHORED: structured item API (auto-generation flattens this grid).
// ==========================================================
function layout_reportPlatformMatrix(cfg) {
  var els = [];
  var HX = 6.665, HY = 3.75, RX = 3.0, RY = 2.35;
  var SPOKE_R = 0.605, BOX_W = 2.22, BOX_H = 1.0, OVERLAP = 0.35;
  var MAX_SPOKES = 8;

  if (cfg.title) els.push({ type:'t', text:cfg.title, x:3.81, y:0.23, w:5.71, h:0.64,
    font:'H', size:35, color:'bodyGray', align:'center', caps:true, lineSpacing:0.8,
    insets:{l:0.035,t:0.035,r:0.035,b:0.035} });

  // Capacity. Boxes are 2.22 x 1.00 and stack on the outer side of their spoke;
  // the ring spans 4.7in vertically, so about four boxes fit per side before
  // they collide. Eight is therefore the ceiling -- which is exactly what the
  // source uses. Extras are dropped rather than allowed to overlap.
  var spokes = cfg.spokes || [];
  if (spokes.length > MAX_SPOKES) {
    console.warn('[deck-layouts] reportPlatformMatrix takes at most ' + MAX_SPOKES +
      ' spokes; ' + (spokes.length - MAX_SPOKES) + ' dropped. More would overlap.');
    spokes = spokes.slice(0, MAX_SPOKES);
  }
  var n = spokes.length;

  // Connectors first, so every disc paints over them.
  var pos = spokes.map(function (s, i) {
    var a = -Math.PI / 2 + (2 * Math.PI * i) / (n || 1);
    return { a:a, x:HX + RX * Math.cos(a), y:HY + RY * Math.sin(a), left:Math.cos(a) < 0 };
  });
  pos.forEach(function (p) {
    els.push({ type:'ln', x:HX, y:HY, w:p.x - HX, h:p.y - HY,
      color:'#7F7F7F', weight:0.38 });
  });

  // Box slots, de-collided per side. Two spokes on the same side can land
  // closer together than a box is tall, so each side is walked top-down and any
  // box that would touch its predecessor is pushed clear.
  var used = { left:[], right:[] };
  pos.forEach(function (p, i) {
    var side = p.left ? 'left' : 'right';
    var by = p.y - SPOKE_R + 0.47;
    used[side].forEach(function (prev) {
      if (Math.abs(by - prev) < BOX_H + 0.06) by = prev + BOX_H + 0.06;
    });
    by = Math.max(0.95, Math.min(7.5 - BOX_H - 0.1, by));
    used[side].push(by);
    p.by = by;
  });

  pos.forEach(function (p, i) {
    var s = spokes[i];
    if (s.header || s.copy) {
      var bx = p.left ? (p.x - SPOKE_R + OVERLAP - BOX_W) : (p.x + SPOKE_R - OVERLAP);
      bx = Math.max(0.1, Math.min(13.33 - BOX_W - 0.1, bx));
      els.push({ type:'s', x:bx, y:p.by, w:BOX_W, h:BOX_H, fill:'none',
        stroke:'#9B9B9B', strokeWidth:1, dash:'dot', radius:0.118 });
      var paras = [];
      if (s.header) paras.push({ runs:[{ text:s.header, size:6, bold:true }] });
      if (s.copy)   paras.push({ runs:[{ text:s.copy,   size:6 }] });
      els.push({ type:'t', x:bx + (p.left ? 0.08 : 0.42), y:p.by + 0.1,
        w:BOX_W - 0.5, h:BOX_H - 0.2,
        font:'B', size:6, color:'#7F7F7F', caps:false, lineSpacing:1.15,
        insets:{l:0.028,t:0.028,r:0.028,b:0.028}, paras:paras });
    }

    // Outer ring is DASHED; the inner disc is solid and carries the shadow.
    els.push({ type:'o', x:p.x - 0.605, y:p.y - 0.605, w:1.21, h:1.21,
      fill:'#EFF0F3', stroke:'#BFA588', strokeWidth:0.5, dash:'dash' });
    els.push({ type:'o', x:p.x - 0.44, y:p.y - 0.44, w:0.88, h:0.88,
      fill:'#EEEEEE', stroke:'#90A291', strokeWidth:2.5, shadow:true });
    if (s.label) els.push({ type:'t', text:s.label, x:p.x - 0.44, y:p.y - 0.44, w:0.88, h:0.88,
      font:'B', size:7, color:'asphalt', align:'center', valign:'middle',
      caps:true, lineSpacing:1, insets:{l:0.02,t:0.02,r:0.02,b:0.02} });
  });

  // Hub, last, so it wins every overlap. Both discs are solid and shadowed.
  els.push({ type:'o', x:HX - 0.865, y:HY - 0.86, w:1.73, h:1.72,
    fill:'#EEEEEE', stroke:'#7F7F7F', strokeWidth:1, shadow:true });
  els.push({ type:'o', x:HX - 0.705, y:HY - 0.7, w:1.41, h:1.4,
    fill:'#EEEEEE', stroke:'#BFA588', strokeWidth:0.5, shadow:true });
  if (cfg.hub) els.push({ type:'t', x:HX - 0.705, y:HY - 0.7, w:1.41, h:1.4,
    font:'B', size:10.5, color:'asphalt', align:'center', valign:'middle',
    caps:true, lineSpacing:1, insets:{l:0.02,t:0.02,r:0.02,b:0.02},
    paras:[{ runs:[{ text:cfg.hub.label || '', size:10.5 }] },
           { runs:[{ text:cfg.hub.name || '', size:20.5 }] }] });

  // Category chips: light-grey gradient disc, white outline, black label, with
  // #7F7F7F bullet text beside it.
  (cfg.categories || []).slice(0, 6).forEach(function (c, i) {
    var cy = 1.04 + i * 0.79;
    els.push({ type:'o', x:0.18, y:cy, w:0.54, h:0.54,
      gradient:{ from:'#EEEEEE', to:'#E8E8E8', angle:90 },
      stroke:'white', strokeWidth:1, shadow:{ offset:0.125 } });
    if (c.code) els.push({ type:'t', text:c.code, x:0.18, y:cy, w:0.54, h:0.54,
      font:'B', size:7, color:'asphalt', align:'center', valign:'middle',
      caps:true, lineSpacing:1, insets:{l:0.02,t:0.02,r:0.02,b:0.02} });
    if (c.text) els.push({ type:'t', x:0.82, y:cy - 0.01, w:1.6, h:0.56,
      font:'B', size:7, color:'#7F7F7F', caps:false, lineSpacing:1.15,
      insets:{l:0.028,t:0.028,r:0.028,b:0.028},
      paras:[{ runs:[{ text:c.text }], bullet:true, marL:0.1, indent:-0.1 }] });
  });
  return els;
}

  var NODE_CY = 1.73, RAIL_Y = 3.11, SMALL_CY = 3.66;
  var CARD_W = 1.44, MAX_BRANCH = 8;
  var SPAN_L = 1.66, SPAN_R = 11.665;

      CARD_W + 'in wide and would overlap.');
    branches = branches.slice(0, MAX_BRANCH);

  if (cfg.root) {

        sy += rowH;

  // Supporting subhead + body, constrained to one full-width line. Per-run

  // Bottom three boxes: white bold header, gray 2-line body. Fixed tan

  });
  els.push({ type:'t', text:'\u203a', x:4.37, y:6.45, w:0.22, h:0.28, font:'B', size:17, color:'accent', bold:true, align:'center', valign:'middle', caps:false, lineSpacing:1 });

  return els;
}

// HAND-AUTHORED: replaces a flat cfg.items[] version that was missing most
// of its own content -- two of each column's three body sections (under
// DELIVERABLES and DEFINE REVIEW TIMELINE) had a header and no bullets, and
// the third had bullets and no header. None of the three section headers
// were underlined (the engine had no underline support at all -- added in

// were plain rectangles. The connector line under "WE ARE HERE" was a
// 0.01in-wide filled rectangle standing in for a line, so it couldn't carry
// arrowheads.
//
// cfg.panels: array of 4 { tone:'dark'|'tan', icon, header, date, sections }
//   sections: array of 3 { label, items } -- items is a list where each
//   entry is a plain string (grey bullet) or { text, bold, color } for a
//   bullet that needs to stand out, e.g. an approval-deadline date.
// tone controls which of the two source treatments a column gets: 'dark'
// (asphalt header/icon, tan date text) or 'tan' (accentDim header/icon,
// asphalt date text) -- matches the source's one-tan-of-four column.
// ==========================================================
function layout_reportJourneyMap(cfg) {
  var els = [];
  var COL_X = [0.19, 3.47, 6.74, 10.02];
  var COL_W = 3.12;
  var SECTIONS_Y = [3.09, 4.24, 5.88];
  var SECTIONS_H = [0.94, 1.26, 0.93];
  var DEFAULT_LABELS = ['DELIVERABLES:', 'DEFINE REVIEW TIMELINE:', 'CLIENT REVIEWERS'];

  if (cfg.tag) els.push({ type:'t', text:cfg.tag || '', x:0.61, y:0.54, w:12.12, h:0.29, font:'B', size:14.5, color:'accentDim', valign:'bottom', caps:true, lineSpacing:0.9, insets:{l:0.035,t:0.035,r:0.035,b:0.035} });
  els.push({ type:'t', text:cfg.title || '', x:0.61, y:0.85, w:12.12, h:0.5, font:'H', size:24, color:'titleGray', caps:true, lineSpacing:1, charSpacing:2.64, insets:{l:0.035,t:0.035,r:0.035,b:0.035} });
  els.push({ type:'t', text:cfg.hereLabel || 'WE ARE HERE', x:4.13, y:1.43, w:1.8, h:0.16, font:'B', size:10, color:'#8D7057', bold:true, align:'center', valign:'middle', caps:true, lineSpacing:1, charSpacing:1.7 });
  // Connector: a real line (was a 0.01in filled rectangle, which can't carry
  // arrowheads), 3pt raw / 2.0005 = 1.5pt, both ends arrowed per source.
  els.push({ type:'ln', x:5.03, y:1.69, w:0, h:0.29, color:'ltGray', weight:1.5, arrows:'both' });

  var panels = cfg.panels || [];
  COL_X.forEach(function (x, i) {
    var p = panels[i] || {};
    var isTan = p.tone === 'tan';
    var headerFill = isTan ? 'accentDim' : 'asphalt';
    var dateColor = isTan ? 'asphalt' : '#ECBE96';

    // Tan outline: a slightly larger tan panel sitting behind the current
    // column's header+white boxes, showing as a frame around them (10.04 x
    // 6.57in raw -> 5.02 x 3.28in engine). It's what makes the tan column
    // read taller than the others -- the header and white boxes underneath
    // are unchanged size, this just peeks out from behind on all four sides.
    if (isTan) els.push({ type:'s', x:x-0.09, y:2.01, w:3.3, h:5.02, fill:'accentDim' });

    // White body drawn BEFORE the header bar so the bar sits on top of it,
    // fully visible -- matches the source's own z-order (the header shape
    // is later in the group than the white box, i.e. topmost). Drawing the
    // header first let the white box cover nearly all of it, hiding the
    // icon/header/date row entirely.
    els.push({ type:'s', x:x, y:2.17, w:COL_W, h:4.78, fill:'white' });
    // Header shape: 6.24 x 1.54 raw -> 3.12 x 0.77 engine (verified against
    // source -- already correct).
    els.push({ type:'s', x:x, y:2.09, w:COL_W, h:0.77, fill:headerFill });

    // Icon: a real circle (was a filled rectangle) with room for one white
    // character.
    els.push({ type:'o', x:x+0.37, y:2.32, w:0.32, h:0.32, fill:'gray' });
    els.push({ type:'t', text:p.icon || String(i+1), x:x+0.37, y:2.32, w:0.32, h:0.32, font:'B', size:12, color:'white', align:'center', valign:'middle', caps:false, lineSpacing:1 });

    // Width widened from the source's literal 1.27in -- at 13pt with 3pt

    els.push({ type:'t', text:p.header || '', x:x+0.86, y:2.37, w:1.75, h:0.22, font:'B', size:13, color:'white', bold:true, valign:'middle', caps:true, lineSpacing:1, charSpacing:3 });
    els.push({ type:'t', text:p.date || '', x:x+1.98, y:2.4, w:0.8, h:0.12, font:'B', size:8, color:dateColor, bold:true, align:'right', caps:true, lineSpacing:1 });

    // Three sections: caps underlined header + bulleted body. A bullet item
    // can be a plain string (grey, standard weight) or { text, bold, color }
    // to call out something like an approval date in black/bold.
    var sections = p.sections || [];
    SECTIONS_Y.forEach(function (sy, si) {
      var sec = sections[si] || {};
      var label = sec.label || DEFAULT_LABELS[si];
      var items = sec.items || [];
      els.push({ type:'t', text:label, x:x+0.37, y:sy, w:2.39, h:0.16, font:'B', size:9, color:'black', bold:true, underline:true, caps:true, lineSpacing:1, charSpacing:1.1 });
      els.push({ type:'t', x:x+0.37, y:sy+0.2, w:2.39, h:SECTIONS_H[si]-0.2, font:'B', size:10, color:'gray', valign:'top', caps:false, lineSpacing:1.15,
        paras:items.map(function (it) {
          var plain = typeof it === 'string';
          return { runs:[{ text: plain ? it : (it.text || ''), bold: plain ? false : !!it.bold, color: plain ? 'gray' : (it.color || 'gray') }], bullet:true, marL:0.12, indent:-0.12 };
        }) });
    });
  });
  els.push({ type:'s', x:0.32, y:3.96, w:2.89, h:0.01, fill:'ltGray' }); // rule
  els.push({ type:'s', x:3.59, y:3.96, w:2.89, h:0.01, fill:'ltGray' }); // rule
  els.push({ type:'s', x:6.87, y:3.96, w:2.89, h:0.01, fill:'ltGray' }); // rule
  els.push({ type:'s', x:10.14, y:3.96, w:2.89, h:0.01, fill:'ltGray' }); // rule
  els.push({ type:'s', x:0.32, y:5.62, w:2.89, h:0.01, fill:'ltGray' }); // rule
  els.push({ type:'s', x:3.59, y:5.62, w:2.89, h:0.01, fill:'ltGray' }); // rule
  els.push({ type:'s', x:6.87, y:5.62, w:2.89, h:0.01, fill:'ltGray' }); // rule
  els.push({ type:'s', x:10.14, y:5.62, w:2.89, h:0.01, fill:'ltGray' }); // rule
  return els;
}

// ==========================================================
// LAYOUT: REPORT GATE STATUS (SLIDE 100)  ->  cfg.layout = "reportGateStatus"
// Template: "Report Gate Status (slide 100)"
// Source slide: 100   Background: solid #FFFFFF
// Set slideData.bgColor = "#FFFFFF" (engine honours bgColor on export + preview).
// HAND-AUTHORED: replaces a flat 32-slot cfg.items[] version. Fully rebuilt
// from the real source: the ribbon headers are PowerPoint's native
// "chevron" preset shape (adj=0.2004), not a generic rectangle -- verified
// by reading the shape XML directly, not guessed from appearance.
//
// cfg.gates: array of 6 { number, title, subhead, bullets }. number is a
// plain string ("1", "2", ...) rendered as "N. TITLE" on the ribbon.
// subhead is optional (the black caps box); bullets is an array of strings.
// cfg.dividers: array of up to 5 { label } "gate cleared" markers, one per
// gap between ribbons (2 gaps per row + return gap = 5 max). Pass fewer to
// only show some; omit cfg.dividers entirely to hide all of them.
// cfg.showConnector: false to hide the row1->row2 connector line (shown by
// default).
// ==========================================================
function layout_reportGateStatus(cfg) {
  var els = [];
  var COL_W = 3.954, ROW_H = 0.539, GAP = 0.07;
  var COL_X = [0.654, 0.654 + COL_W + GAP, 0.654 + (COL_W + GAP) * 2];
  var ROW_Y = [0.412, 3.693];
  var SUB_GAP = 0.233, SUB_H = 0.22, SUB_W = 3.149;
  var BULLET_GAP = 0.08;
  // Chevron polygon: PowerPoint's "chevron" preset, adj=0.2004 -- notch/point
  // depth = min(w,h) * adj. Left corners stay at x=0 (clean 90deg corners,
  // not cut on a diagonal); the notch tip is pulled inward from there. Right
  // corners stay at x=1-nd with the point tip at x=1. An earlier version of
  // this shape started the top/bottom edges at x=nd instead of x=0, which
  // both angled the corners AND put the "notch" outside the shape as a
  // leftward bulge instead of cutting into it -- fixed here.
  var ADJ = 0.2004;
  var depthFrac = (Math.min(COL_W, ROW_H) * ADJ);
  var nd = depthFrac / COL_W;
  var CHEVRON_PTS = [[0,0],[1-nd,0],[1,0.5],[1-nd,1],[0,1],[nd,0.5]];

  // Gate dividers pushed BEFORE the chevrons/gates below. Confirmed against
  // the source's actual per-instance Y positions: dividers sit just below
  // each row's ribbon (a ~0.12-0.2in gap), not centered on/overlapping it --
  // an earlier version of this wrongly centered the divider vertically on
  // the ribbon row, which pushed row 1's dividers above the canvas top.
  var DIV_W = 0.236, DIV_H = 1.771, DIV_TOP_GAP = 0.16;
  var GAP_CENTERS = [
    { x: COL_X[0] + COL_W + GAP / 2, y: ROW_Y[0] },
    { x: COL_X[1] + COL_W + GAP / 2, y: ROW_Y[0] },
    { x: COL_X[0] + COL_W + GAP / 2, y: ROW_Y[1] },
    { x: COL_X[1] + COL_W + GAP / 2, y: ROW_Y[1] },
    { x: COL_X[2] + COL_W + GAP / 2, y: ROW_Y[1] }
  ];
  var dividers = cfg.dividers || [];
  dividers.slice(0, 5).forEach(function (d, i) {
    var c = GAP_CENTERS[i]; if (!c) return;
    var dx0 = c.x - DIV_W / 2, dy0 = c.y + ROW_H + DIV_TOP_GAP;
    els.push({ type:'s', x:dx0, y:dy0, w:DIV_W, h:DIV_H, fill:'accentDim' });
    var cx = dx0 + DIV_W / 2, cy = dy0 + DIV_H / 2;
    els.push({ type:'t', text:d.label || d, x:cx - DIV_H / 2, y:cy - DIV_W / 2, w:DIV_H, h:DIV_W, font:'B', size:7, color:'white', bold:true, align:'center', valign:'middle', caps:true, lineSpacing:1, rotation:90 });
  });

  var gates = cfg.gates || [];
  var gateBottom = []; // per-column bottom Y of each row's content, for reference
  COL_X.forEach(function (colX, ci) {
    ROW_Y.forEach(function (rowY, ri) {
      var g = gates[ri * 3 + ci] || {};
      els.push({ type:'s', x:colX, y:rowY, w:COL_W, h:ROW_H, fill:'gray', points:CHEVRON_PTS });
      els.push({ type:'t', text:((g.number || (ri*3+ci+1)) + '. ' + (g.title || '')), x:colX + 0.27, y:rowY + 0.127, w:COL_W - 0.54, h:0.285, font:'B', size:13.5, color:'white', bold:true, valign:'middle', caps:true, lineSpacing:1 });
      var y = rowY + ROW_H + SUB_GAP;
      // Centered in the column's width beneath the chevron above it -- both
      // the subhead box and the bullets under it share this offset, so the
      // whole content block stays aligned as one unit. Previously only
      // colX (the column/chevron's own left edge) was used, which put all
      // the box's margin-from-column on the right side only.
      var subX = colX + (COL_W - SUB_W) / 2;
      if (g.subhead) {
        els.push({ type:'s', x:subX, y:y, w:SUB_W, h:SUB_H, fill:'#3A3A3A' });
        // Insets trimmed from the source's 0.104in to 0.05in to reclaim
        // width for the text without changing the box itself (box size is
        // correct per the source; this sandbox's Arial fallback for Mazda
        // Type is what's actually causing the wrap -- see note below).
        els.push({ type:'t', text:g.subhead, x:subX, y:y, w:SUB_W, h:SUB_H, font:'B', size:9, color:'white', bold:true, valign:'middle', caps:true, lineSpacing:1, insets:{l:0.05,t:0.035,r:0.05,b:0.035} });
        y += SUB_H + BULLET_GAP;
      }
      if (g.bullets && g.bullets.length) {
        els.push({ type:'t', x:subX, y:y, w:SUB_W, h:(ROW_Y[1] - ROW_Y[0]) - (y - rowY) - 0.1, font:'B', size:10, color:'black', valign:'top', caps:false, lineSpacing:1.15,
          insets:{l:0.104,t:0.035,r:0.104,b:0.035},
          paras:g.bullets.map(function (b) { return { runs:[{ text:b }], bullet:true, marL:0.12, indent:-0.12 }; }) });
      }
    });
  });

  // Gate dividers: comment kept with the code above where they're actually
  // pushed now (before the chevrons). Text is built as a normal horizontal
  // box (matches the source's own pre-rotation text properties -- middle
  // valign, horizontal direction) sized to the divider's visible HEIGHT,
  // then rotated 90deg in place so it reads vertically.

  // Connector: dotted-end line from the last ribbon of row 1 (its outward
  // point) down to the first ribbon of row 2 (its inward notch), held off
  // the ribbons by CONNECTOR_GAP rather than touching them. The horizontal
  // run sits just above row 2's chevrons (not halfway between the rows) so
  // it clears row 1's tan gate dividers, which extend down to ~2.88in --
  // the previous halfway placement cut straight through them.
  if (cfg.showConnector !== false) {
    var CONNECTOR_GAP = 0.12, ROW2_CLEARANCE = 0.1;
    var r1x = COL_X[2] + COL_W + CONNECTOR_GAP, r1y = ROW_Y[0] + ROW_H / 2;
    var r2x = COL_X[0] - CONNECTOR_GAP, r2y = ROW_Y[1] + ROW_H / 2;
    var midY = ROW_Y[1] - ROW2_CLEARANCE;
    els.push({ type:'ln', x:r1x, y:r1y, w:0.3, h:0, color:'black', weight:2, markerStyle:'dot', arrows:'start' });
    els.push({ type:'ln', x:r1x + 0.3, y:r1y, w:0, h:midY - r1y, color:'black', weight:2 });
    els.push({ type:'ln', x:r1x + 0.3, y:midY, w:r2x - 0.3 - (r1x + 0.3), h:0, color:'black', weight:2 });
    els.push({ type:'ln', x:r2x - 0.3, y:midY, w:0, h:r2y - midY, color:'black', weight:2 });
    els.push({ type:'ln', x:r2x - 0.3, y:r2y, w:0.3, h:0, color:'black', weight:2, markerStyle:'dot', arrows:'end' });
  }

  return els;
}

// ==========================================================
// ==========================================================
// LAYOUT: REPORT NUMBERED STEPS (SLIDE 101)  ->  cfg.layout = "reportNumberedSteps"
// Template: "Report Numbered Steps (slide 101)"
// Source slide: 101   Background: solid #FFFFFF
// Set slideData.bgColor = "#FFFFFF" (engine honours bgColor on export + preview).
// HAND-AUTHORED: replaces a flat 24-slot cfg.items[] version. Rebuilt from
// the real source, including its connector line's exact bezier path (read
// from the custGeom XML directly, not approximated) -- required the engine
// to gain a new element type (type:'path') since the connector is a real
// S-curve, not straight segments; renderLine only ever drew straight lines.
//
// 6 fixed steps in a 3-col x 2-row serpentine (row 2 is offset right of
// row 1 by design, not misaligned -- matches the source). cfg.steps: array
// of 6 { number, label, subhead, intro, bullets }. label is shown on BOTH
// the tan pill above and the black pill below, matching the source (both
// pills carry identical text per step, just different fill/text color).
// number defaults to the step's position (1-6) if omitted. intro is an
// optional non-bulleted first line before bullets, matching the source's
// own body-copy pattern.
// ==========================================================
function layout_reportNumberedSteps(cfg) {
  var els = [];
  // Column/row positions, taken directly from the source (row 2 is shifted
  // ~1.04in right of row 1 -- part of the serpentine layout, not a mistake).
  var TAN_X = [[0.934, 4.808, 8.583], [1.977, 5.851, 9.626]];
  var TAN_Y = [1.978, 4.289];
  var TAN_W = 1.6, TAN_H = 0.292;
  var GRP_X = [[1.379, 5.222, 9.065], [2.422, 6.265, 10.108]];
  var GRP_Y = [2.338, 4.649];

  if (cfg.tag) els.push({ type:'t', text:cfg.tag, x:0.606, y:0.536, w:12.118, h:0.292, font:'B', size:14.5, color:'accentDim', valign:'bottom', caps:true, lineSpacing:0.9, insets:{l:0.035,t:0.035,r:0.035,b:0.035} });
  els.push({ type:'t', text:cfg.title || '', x:0.606, y:0.847, w:12.118, h:0.5, font:'H', size:24, color:'titleGray', caps:true, lineSpacing:1, charSpacing:2.64, insets:{l:0.035,t:0.035,r:0.035,b:0.035} });
  if (cfg.intro) els.push({ type:'t', text:cfg.intro, x:0.606, y:1.333, w:12.118, h:0.386, font:'B', size:10, color:'bodyGray', caps:false, lineSpacing:1.1, insets:{l:0.028,t:0.028,r:0.028,b:0.028} });

  // Connector: real bezier S-curve, decoded from the source's own custGeom
  // path (straight along each row, curved at the turns) -- large tan dot
  // at the start, arrow off-slide at the end.
  if (cfg.showConnector !== false) {
    els.push({ type:'path', x:0.641, y:2.121, w:12.049, h:4.639, color:'accentDim', weight:5,
      startMarker:'oval', endMarker:'triangle',
      path:[
        { cmd:'M', x:0, y:0 },
        { cmd:'L', x:0.9037, y:0 },
        { cmd:'C', x1:0.9569, y1:0, x2:1, y2:0.1119, x:1, y:0.25 },
        { cmd:'C', x1:1, y1:0.3881, x2:0.9569, y2:0.5, x:0.9037, y:0.5 },
        { cmd:'L', x:0.0963, y:0.5 },
        { cmd:'C', x1:0.0431, y1:0.5, x2:0, y2:0.6119, x:0, y:0.75 },
        { cmd:'C', x1:0, y1:0.888, x2:0.0431, y2:1, x:0.0963, y:1 },
        { cmd:'L', x:1, y:1 }
      ] });
  }

  var steps = cfg.steps || [];
  for (var row = 0; row < 2; row++) {
    for (var col = 0; col < 3; col++) {
      var i = row * 3 + col;
      var st = steps[i] || {};
      var label = (st.number || (i + 1)) + '. ' + (st.label || '');
      var tx = TAN_X[row][col], ty = TAN_Y[row];
      var gx = GRP_X[row][col], gy = GRP_Y[row];

      // Tan pill (drawn on top of the connector, which passes behind it).
      els.push({ type:'s', x:tx, y:ty, w:TAN_W, h:TAN_H, fill:'accentDim', radius:'pill' });
      els.push({ type:'t', text:label, x:tx + 0.04, y:ty + 0.02, w:TAN_W + 0.13, h:TAN_H - 0.03, font:'B', size:12, color:'#EEEEEE', valign:'middle', caps:true, lineSpacing:1 });

      // Black pill.
      els.push({ type:'s', x:gx, y:gy, w:TAN_W, h:TAN_H, fill:'asphalt', radius:'pill' });
      els.push({ type:'t', text:label, x:gx + 0.04, y:gy + 0.02, w:TAN_W + 0.13, h:TAN_H - 0.03, font:'B', size:12, color:'#868686', valign:'middle', caps:true, lineSpacing:1 });

      // Tan pill -> black pill -> subhead is a 3-level stairstep in the
      // source, each level offset ~0.70in (raw) / 0.35in (engine) right and
      // down from the one above. The source's actual black-pill placement
      // drifts off that clean diagonal by ~0.19in raw -- confirmed by
      // reading its real coordinates, not assumed -- so anchoring the
      // subhead/body/line to the black pill (gx/gy) inherited that drift.
      // Anchoring them to the tan pill instead, two clean steps down,
      // keeps them uniform across all 6 steps regardless of how far off
      // any individual black pill happens to sit.
      var STEP = 0.35;
      var stairX = tx + 2 * STEP, stairY = ty + 2 * STEP;

      // Vertical dark-gray double-arrow line beneath the black pill.
      els.push({ type:'ln', x:stairX, y:stairY + 0.035, w:0, h:1.407, color:'#808080', weight:1.5, arrows:'both' });

      // Subhead + body, stair-stepped to align with the vertical line (not
      // flush with the pill's own left edge).
      if (st.subhead) {
        els.push({ type:'t', text:st.subhead, x:stairX, y:stairY, w:2.36, h:0.363, font:'B', size:10, color:'#CAA380', bold:true, caps:false, lineSpacing:1.1, insets:{l:0.035,t:0.035,r:0.035,b:0.035} });
      }
      var bodyParas = [];
      if (st.intro) bodyParas.push({ runs:[{ text:st.intro }] });
      (st.bullets || []).forEach(function (b) { bodyParas.push({ runs:[{ text:b }], bullet:true, marL:0.12, indent:-0.12 }); });
      if (bodyParas.length) {
        els.push({ type:'t', x:stairX, y:stairY + 0.372, w:2.96, h:1.064, font:'B', size:10, color:'#808080', valign:'top', caps:false, lineSpacing:1.15, insets:{l:0.035,t:0.035,r:0.035,b:0.035}, paras:bodyParas });
      }
    }
  }

  return els;
}

// LAYOUT: TABLE OF CONTENTS  ->  cfg.layout = "tableOfContents"
// Template: "Table of contents"
// Source slide: 22   Background: solid #FFFFFF
// Set slideData.bgColor = "#FFFFFF".
// HAND-AUTHORED: structured item API (auto-generation flattens this grid).
// ==========================================================
// Agenda. Faithful to template slide 22 -- four distinct pieces:
//
//  1. HEADING  one box, one paragraph, a <br/> between two runs:
//     grey subtitle above black title. 17pt bold ALL CAPS, 90% line spacing.
//  2. LIST     one box. Each item is a grey NUMBER run + a black TOPIC run at
//     30pt bold, 110% line spacing. Sub-bullets sit under an item at 15pt bold
//     black, hanging indent, bullet glyph at 80% of text size.
//  3. COPY BLOCK  lower left, 10pt grey -- this layout has no footer.
//  4. BACKDROP  two crops of one image at 65.6% opacity behind the list.
//
// cfg.items accepts either a plain string or {number, topic, subs:[...]}:
//   items:[ 'Introduce the concept',
//           {number:'02', topic:'Present the approach',
//            subs:['Creative territory','Production plan']} ]
// Numbers auto-generate as 01, 02, 03... unless you supply one.
//
// CAPACITY: the list box gives 4.42in of inner height (4.63 less insets). A 30pt item costs 0.46in and
// a 15pt sub-bullet 0.23in, so 9 items with no subs, or fewer as subs are added.
// Overflow is dropped with a console warning rather than silently clipped.
function layout_tableOfContents(cfg) {
  var els = [];

  // 1 -- backdrop graphic (two crops of the same asset, behind everything)
  var backdrop = (cfg.assets && cfg.assets['thankyou_texture.png']) || A + 'backgrounds/thankyou_texture.png';
  els.push({ type:'img', src:backdrop, x:6.41, y:-0.01, w:6.93, h:3.25,
    transparency:34.4, crop:{ t:0.078, r:0.5902, b:0.6815 } });
  els.push({ type:'img', src:backdrop, x:3.67, y:3.24, w:9.67, h:4.28,
    transparency:34.4, crop:{ r:0.4283, b:0.6825 } });

  // 2 -- heading: grey subtitle over black title, one box, one paragraph
  els.push({ type:'t', x:0.29, y:0.43, w:2.81, h:0.72,
    font:'B', size:17, bold:true, caps:true, lineSpacing:0.9, charSpacing:0,
    color:'bodyGray', insets:{l:0.104,t:0.104,r:0.104,b:0.104},
    // Two paragraphs rather than one run carrying a newline: the source uses
    // <a:br/> inside a single paragraph, and at 90% line spacing two paragraphs
    // are visually identical -- but a literal \n in a run is collapsed by HTML
    // in the preview and would silently join the two lines.
    paras:[
      { runs:[{ text:(cfg.subtitle || 'Subtitle'), color:'bodyGray' }] },
      { runs:[{ text:(cfg.title || 'Table of contents'), color:'black' }] }
    ]});

  // 3 -- the list
  var items = cfg.items || [];
  // Slide 22 sets the list box to 4.63in (the layout definition says 4.37);
  // the instance wins, per the demo-slide-authoritative rule. Inner height is
  // 4.63 less the 0.104in top and bottom insets.
  var paras = [], budget = 4.42, used = 0, dropped = 0;
  items.forEach(function (raw, i) {
    var it = (typeof raw === 'string') ? { topic: raw } : (raw || {});
    var num = it.number || ('0' + (i + 1)).slice(-2);
    var cost = 0.46 + ((it.subs || []).length * 0.23);
    if (used + cost > budget) { dropped++; return; }
    used += cost;
    paras.push({ runs:[
      { text:num, color:'bodyGray' },
      { text:' ' + (it.topic || ''), color:'black' }
    ]});
    (it.subs || []).forEach(function (sub) {
      paras.push({ runs:[{ text:sub, color:'black' }],
        size:15, marL:0.82, indent:-0.42,
        bullet:true, bulletSizePct:80, indentLevel:1 });
    });
  });
  if (dropped) {
    console.warn('[deck-layouts] tableOfContents: ' + dropped +
      ' item(s) did not fit the list box and were dropped.');
  }
  els.push({ type:'t', x:5.42, y:0.40, w:7.58, h:4.63,
    font:'B', size:30, bold:true, caps:false, lineSpacing:1.1, charSpacing:0,
    color:'bodyGray', insets:{l:0.104,t:0.104,r:0.104,b:0.104}, paras:paras });

  // 4 -- copy block, lower left. Replaces the footer on this layout.
  if (cfg.text) {
    els.push({ type:'t', text:cfg.text, x:0.29, y:6.33, w:4.02, h:0.89,
      font:'B', size:10, color:'bodyGray', caps:false, lineSpacing:1.1, charSpacing:0,
      insets:{l:0.104,t:0.104,r:0.104,b:0.104} });
  }
  return els;
}

// Shared body for both table variants -- the only real differences between
// them are the header band's fill/text color, confirmed against the source.
function tableBody(cfg, theme) {
  var els = [];
  if (cfg.tag) els.push({ type:'t', text:cfg.tag, x:0.61, y:0.54, w:12.12, h:0.29,
    font:'B', size:14.5, color:'accentDim', valign:'bottom', caps:true, lineSpacing:0.9,
    insets:{l:0.035,t:0.035,r:0.035,b:0.035} });
  els.push({ type:'t', text:cfg.title || '', x:0.61, y:0.85, w:12.12, h:0.5,
    font:'H', size:24, color:'titleGray', caps:true, lineSpacing:1, charSpacing:2.64,
    insets:{l:0.035,t:0.035,r:0.035,b:0.035} });
  if (cfg.intro || cfg.text) els.push({ type:'t', text:cfg.intro || cfg.text, x:0.61, y:1.33, w:12.12, h:0.39,
    font:'B', size:10, color:'bodyGray', caps:false, lineSpacing:1.1,
    insets:{l:0.028,t:0.028,r:0.028,b:0.028} });

  var TBL_X = 0.64, TBL_Y = 2.04, COL1_W = 8.557, COL2_W = 3.498;
  var HEADER_H = 0.904, ROW_H = 0.955;
  var COL2_X = TBL_X + COL1_W;
  var DIVIDER = '#5E5E5E';

  var headers = cfg.headers || [];
  els.push({ type:'s', x:TBL_X, y:TBL_Y, w:COL1_W + COL2_W, h:HEADER_H, fill:theme.headerFill });
  els.push({ type:'t', text:headers[0] || '', x:TBL_X + 0.13, y:TBL_Y, w:COL1_W - 0.26, h:HEADER_H,
    font:'B', size:17, color:theme.headerText, bold:true, valign:'middle', caps:true, lineSpacing:0.9 });
  els.push({ type:'t', text:headers[1] || '', x:COL2_X + 0.13, y:TBL_Y, w:COL2_W - 0.26, h:HEADER_H,
    font:'B', size:17, color:theme.headerText, bold:true, valign:'middle', caps:true, lineSpacing:0.9 });

  var rows = cfg.rows || [];
  function cell(x, w, y, h, content) {
    if (!content) return;
    var ty = y + 0.2;
    if (content.heading) {
      // Box tall enough for two lines so a wrap (narrower right column,
      // or this sandbox's Arial fallback running wider than Mazda Type)
      // doesn't get clipped -- but the bullets below only shift down a
      // little, not a full second line's worth, or they end up cramped
      // against the row boundary instead. In the normal single-line case
      // this leaves a small gap; in the wrap case the bullets sit close
      // under the wrapped second line rather than fully clear of it --
      // the lesser of the two failure modes.
      els.push({ type:'t', text:content.heading, x:x + 0.13, y:ty, w:w - 0.26, h:0.48,
        font:'B', size:20, color:'#CFB496', caps:true, charSpacing:2.2, lineSpacing:1 });
      ty += 0.44;
    }
    if (content.bullets && content.bullets.length) {
      els.push({ type:'t', x:x + 0.13, y:ty, w:w - 0.26, h:(y + h) - ty - 0.1,
        font:'B', size:8, color:'#919292', valign:'top', caps:true, lineSpacing:1.2,
        insets:{l:0,t:0,r:0,b:0},
        paras:content.bullets.map(function (b) { return { runs:[{ text:b }], bullet:true, marL:0.21, indent:-0.14 }; }) });
    }
  }

  var y = TBL_Y + HEADER_H;
  for (var i = 0; i < 4; i++) {
    var r = rows[i] || {};
    cell(TBL_X, COL1_W, y, ROW_H, r.left);
    cell(COL2_X, COL2_W, y, ROW_H, r.right);

  txt(COL_X[5], COL_W[5], TBL_Y + HEAD_H[0], HEAD_H[1], ht.basePlanIncremental || '$0M', { color:'white', bold:true });

function resolve(name) {
  if (!name) return null;
  if (AMBIGUOUS[name]) {
    console.error('[deck-layouts] "' + name + '" meant "' + AMBIGUOUS[name] +
      '" in v1.0 but is a DIFFERENT layout in v2.0. Rendering the v2.0 meaning. ' +
      'If this deck was authored against v1.0, change it to "' + AMBIGUOUS[name] + '".');
  }
  if (LAYOUT_MAP[name]) return LAYOUT_MAP[name];
  if (RETIRED[name]) {
    console.warn('[deck-layouts] "' + name + '" was retired; rendering "' +
      RETIRED[name] + '" instead.');
    return LAYOUT_MAP[RETIRED[name]];
  }
  if (LEGACY_ALIASES[name]) {
    console.warn('[deck-layouts] "' + name + '" is a v1.0 name; use "' + LEGACY_ALIASES[name] + '".');
    return LAYOUT_MAP[LEGACY_ALIASES[name]];
  }
  if (TEMPLATE_NAMES[name]) return LAYOUT_MAP[TEMPLATE_NAMES[name]];
  return null;
}

function prefetchImage(url) {

function prerenderIcon(name, size, color) {

function generatePlaceholderImage(w, h, isDark) {
  var canvas = document.createElement('canvas');

  canvas.width = pw; canvas.height = ph;

  ctx.fillRect(0, 0, pw, ph);

  ctx.lineWidth = 2; ctx.strokeRect(1, 1, pw - 2, ph - 2);
  ctx.strokeStyle = isDark ? '#606870' : '#E0E0E0';

  ctx.moveTo(0, 0); ctx.lineTo(pw, ph);
  ctx.moveTo(pw, 0); ctx.lineTo(0, ph); ctx.stroke();

  var contentFooterText = SD.getContentFooter();

  pptx.defineSlideMaster({ title: 'SD_DARK', background: { color: darkBgColor },
    objects: [{ text: { text: footerText, options: { x: 0.3, y: 7.05, w: 4, h: 0.3, fontSize: 7, fontFace: FONT, color: '999999', bold: false, letterSpacing: 1.5 } } }] });
  pptx.defineSlideMaster({ title: 'SD_LIGHT', background: { color: lightBgColor },
    objects: [{ text: { text: footerText, options: { x: 0.3, y: 7.05, w: 4, h: 0.3, fontSize: 7, fontFace: FONT, color: '999999', bold: false, letterSpacing: 1.5 } } }] });

  pptx.defineSlideMaster({ title: 'SD_DARK_NOFOOTER', background: { color: darkBgColor } });
  pptx.defineSlideMaster({ title: 'SD_LIGHT_NOFOOTER', background: { color: lightBgColor } });

  if (contentFooterText) {
    pptx.defineSlideMaster({ title: 'SD_DARK_CONTENT', background: { color: darkBgColor },
      objects: [{ text: { text: contentFooterText, options: { x: 0.3, y: 7.05, w: 4, h: 0.3, fontSize: 7, fontFace: FONT, color: '767676', bold: false, letterSpacing: 1.5 } } }] });
    pptx.defineSlideMaster({ title: 'SD_LIGHT_CONTENT', background: { color: lightBgColor },
      objects: [{ text: { text: contentFooterText, options: { x: 0.3, y: 7.05, w: 4, h: 0.3, fontSize: 7, fontFace: FONT, color: '767676', bold: false, letterSpacing: 1.5 } } }] });

  var fileName = title + '_' + _D.length + 'slides.pptx';

  // kerning OFF. The MMW spec calls for kerning at 1pt and above (kern="100").
  // There is no API for it, so repack the .pptx and rewrite the attribute.

  // If it is unavailable for any reason, fall back to the unpatched download

// ============================================================
// PPTX ELEMENT EXPORTERS
// ============================================================

function exportElement(slide, el, isDark, accent, pptx) {
  var m = { t: exportText, s: exportShape, o: exportOval, d: exportDivider, p: exportPill, b: exportBar, ln: exportLine, path: exportPath, chart: exportChart, tbl: exportTable, i: exportIcon, img: exportImage };
  var fn = m[el.type]; if (fn) fn(slide, el, isDark, accent, pptx);

// PptxGenJS margin is in POINTS, ordered [top, right, bottom, left].
function insetMargin(el) {
  if (!el.insets) return [0, 0, 0, 0];
  return [(el.insets.t || 0) * 72, (el.insets.r || 0) * 72,
          (el.insets.b || 0) * 72, (el.insets.l || 0) * 72];
}

function exportText(slide, el, isDark) {
  var isCompact = el.w <= 0.80 && el.h <= 0.80;
  var exportedText = el.text || '';
  var cs, lsm, boldFlag;

  // EXPLICIT TYPOGRAPHY (v2.0) -- see the matching note in standard-deck.js.
  // `caps` present => the layout specified casing/tracking/line-height from the
  // template; do not let getTextStyle() guess and override them.
  if (el.caps !== undefined) {
    if (el.caps) exportedText = exportedText.toUpperCase();
    cs = (el.charSpacing != null) ? el.charSpacing : 0;
    lsm = (el.lineSpacing != null) ? el.lineSpacing : 1.0;
    boldFlag = !!el.bold;
  } else {
    var textStyle = SD.getTextStyle(el);
    if (['L1','L2','L3','L5'].indexOf(textStyle) > -1) exportedText = exportedText.toUpperCase();
    cs = 0;
    if (textStyle === 'L1') cs = 12; else if (textStyle === 'L3') cs = 3;
    else if (textStyle === 'L2') cs = 2; else if (textStyle === 'L5') cs = 4;
    var ts = SD.TEXT_STYLES[textStyle];
    lsm = isCompact ? 1.0 : 1.35;
    boldFlag = ts.weight >= 700 || el.bold;
  }

  // Rich paragraphs -- see the matching note in standard-deck.js. PptxGenJS
  // takes an array of {text, options}; breakLine ends a paragraph, and bullet /
  // indentLevel carry the sub-bullet treatment.
  if (el.paras && el.paras.length) {
    var seq = [];
    el.paras.forEach(function (p, pi) {
      var runs = p.runs || [];
      runs.forEach(function (r, ri) {
        var o = { fontFace: fontFor(el), fontSize: p.size || el.size,
                  color: SD.colorForPptx(r.color || el.color || 'body', isDark),
                  bold: (r.bold !== undefined) ? r.bold : !!el.bold,
                  charSpacing: el.charSpacing || 0,
                  lineSpacingMultiple: el.lineSpacing != null ? el.lineSpacing : 1.0 };
        if (r.size) o.fontSize = r.size;
        if (p.bullet) {
          o.bullet = { characterCode: (p.bulletCode || '2022') };
          // PptxGenJS defaults the bullet margin to 27pt (0.375in) and sets
          // marL/indent from it. The template hangs its bullets much tighter --
          // 0.125in on the spend bars -- so derive the gap from the paragraph's
          // own hanging indent instead of taking the library default.
          if (p.indent) o.bullet.indent = Math.abs(p.indent) * 72;
          if (p.indentLevel) o.indentLevel = p.indentLevel;
        }
        // breakLine on the last run of each paragraph except the final one
        if (ri === runs.length - 1 && pi < el.paras.length - 1) o.breakLine = true;
        seq.push({ text: (el.caps ? String(r.text || '').toUpperCase() : (r.text || '')),
                   options: o });
      });
    });
    slide.addText(seq, { x: el.x, y: el.y, w: el.w, h: el.h,
      align: el.align || 'left', valign: el.valign || 'top',
      margin: insetMargin(el), wrap: true, rotate: el.rotation || undefined });
    return;
  }

  slide.addText(exportedText, {
    x: el.x, y: el.y, w: el.w, h: el.h, fontSize: el.size, fontFace: fontFor(el),
    bold: boldFlag, italic: !!el.italic,
    color: SD.colorForPptx(el.color || 'body', isDark),
    align: el.align || (isCompact ? 'center' : 'left'), valign: el.valign || 'top',
    charSpacing: cs, lineSpacingMultiple: lsm,

// Swap the rect geometry of a tagged picture for its real outline. PptxGenJS

// frame; PowerPoint's path space is arbitrary, so 21600 (its own convention)
// keeps the numbers integral.

function applyGradients(xml) {

    var m = sp.match(/<p:cNvPr[^>]*name="(mmwgrad\d+)"/);

// <a:custDash> has no PptxGenJS equivalent, but the presets are close enough:

  // fill is given; passing { type:'none' } instead yields a SOLID shape.

function exportLine(slide, el, isDark, accent, pptx) {
  var col = SD.colorForPptx(el.color || 'ltGray', isDark);

  // default is the triangle arrowhead.

// Curved connector -- mirrors renderPath() in standard-deck.js. el.path is a
// list of {cmd:'M'|'L', x, y} or {cmd:'C', x1,y1, x2,y2, x, y} segments whose
// coordinates are fractions (0-1) of el.x/y/w/h. Exported as a PowerPoint
// custom-geometry freeform: an OPEN stroked path (no close, no fill), with

    if (s.cmd === 'C') {

}

function exportOval(slide, el, isDark, accent, pptx) {
  var opts = { x:el.x, y:el.y, w:el.w, h:el.h,

function exportBar(slide, el, isDark, accent, pptx) { slide.addShape(pptx.shapes.RECTANGLE, { x:el.x, y:el.y, w:el.w, h:el.h, fill:{color:SD.colorForPptx(el.fill||'accent',isDark)} }); }

function exportIcon(slide, el, isDark) {

function exportImage(slide, el) {
  // v1.0 looked up getElementById(el.ref) then querySelector('img') on it -- but
  // the artifact declares refs as <img id="gi0"> directly, and an <img> has no
  // child <img>, so this returned null and every brand mark was silently dropped
  // from the PPTX. Resolve via the shared helper, and fall back to a linked path
  // when the image could not be cached as a data URI.
  var src = SD.resolveImgSrc ? SD.resolveImgSrc(el) : el.src;
  if (!src) { console.warn('[deck-shell] image element has no resolvable src/ref: ' + (el.ref || '?')); return; }
  var opts = { x: el.x, y: el.y, w: el.w, h: el.h };
  var data = (src.indexOf('data:') === 0) ? src : _imageCache[src];
  if (data) opts.data = data; else opts.path = src;

  if (typeof el.transparency === 'number') opts.transparency = el.transparency;

  if (el.fit === 'cover' && !el.crop) opts.sizing = { type: 'cover', w: el.w, h: el.h };
  // srcRect -> PptxGenJS crop sizing.
  //
  // Its crop model is "place the image at w/h, then keep the box at x/y/w/h",
  // and it computes r/b as (imageSize - box). So the image option must describe
  // the FULL image and the box the kept region -- passing the frame size for
  // both yields r = -x, a negative srcRect PowerPoint renders as a visible,
  // wrongly-scaled box. It also resizes the picture to the crop box, so the
  // image option additionally has to be pre-divided by the kept fraction for
  // the picture to land at the size the layout asked for.
  if (el.crop) {

  // rect or ellipse. Tag this one with a unique objectName so the repack step
  // can swap in the real <a:custGeom>, giving PowerPoint a natively masked
  // picture the user can still right-click and replace.
  if (el.mask && el.mask.length > 2) {
    var tag = 'mmwmask' + (_maskSeq++);
    opts.objectName = tag;
    _maskJobs[tag] = el.mask;
  }
  slide.addImage(opts);
}

function deckInit(config) {
config = config || {}; _config = config; _D = window.D || [];
_totalSlides = _D.length; _noLogo = !!config.noLogo; _imageMode = !!config.imageMode;

else if (window.AH) SD.setAccent(window.AH, window.AL, window.AD);

if (config.footer) SD.setFooter(config.footer);

if (config.contentFooter === false || config.contentFooter === 'none') SD.setContentFooter(null);
else if (config.contentFooter) SD.setContentFooter(config.contentFooter);

window._deckTitle = config.title || 'Presentation';

// ------------------------------------------------------------
// DEFAULT PHOTOGRAPHY -- assigned ONCE, here.
// Image-led layouts (coverPhoto, coverPhoto2, headlinePhotoWell, headlinePhoto)
// pre-populate with real photography from the template deck, rotating through
// the pool so consecutive image covers in one deck do not repeat.
//
// This runs at init rather than inside the layout functions on purpose:
// dispatch() is called several times per slide (preview render, asset prefetch,
// icon pre-render, PPTX export). A rotation counter inside a layout would
// advance on every one of those passes, so the preview and the exported file
// would disagree about which photo each slide got. Assigning into _D once makes
// dispatch a pure function of the slide data.
//
// Anything the deck already specifies wins -- this only fills gaps. Disable
// entirely with deckInit({ defaultPhotos:false }).
// ------------------------------------------------------------
if (config.defaultPhotos !== false && window.DeckLayouts && window.DeckLayouts.PHOTO_DEFAULTS) {
  var _pools = window.DeckLayouts.PHOTO_DEFAULTS;
  var _seen = {};
  _D.forEach(function (sd) {
    if (!sd || !sd.layout) return;
    var spec = _pools[sd.layout];
    if (!spec || !spec.pool || !spec.pool.length) return;
    var n = (_seen[sd.layout] = (_seen[sd.layout] === undefined ? 0 : _seen[sd.layout] + 1));
    var pick = spec.pool[n % spec.pool.length];
    if (spec.target === 'bgImage') {

    } else {

}

if (window.DeckLayouts && window.DeckLayouts.getPrefetchUrls) window.DeckLayouts.getPrefetchUrls().forEach(prefetchImage);

// Data-driven asset prefetch. Layout functions never call registerPrefetch(), so
// _prefetchUrls is empty in practice -- backgrounds and brand marks were never
// cached and therefore never embedded on export. Collect them off the deck data
// itself: every slide background, plus every image element the layouts emit.
(function prefetchDeckAssets() {
  var urls = {};
  function want(u) { if (u && u.indexOf('data:') !== 0) urls[u] = 1; }
  _D.forEach(function (sd) {
    if (!sd) return;
    want(sd.bgImage);
    var els = (sd.layout && window.DeckLayouts) ? window.DeckLayouts.dispatch(sd) : (sd.els || []);
    els.forEach(function (el) {

var toolbar = buildToolbar(container);

var colorPicker = buildColorPicker(toolbarRight);
